<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSK Flashcards — NPTE</title>
<style>
  :root {
    --bg-primary:#ffffff;--bg-secondary:#f5f4f0;--bg-tertiary:#edecea;
    --text-primary:#1a1a1a;--text-secondary:#6b6966;--text-tertiary:#a09d9a;
    --border:rgba(0,0,0,0.12);--border-md:rgba(0,0,0,0.22);
    --radius-md:8px;--radius-lg:12px;--purple:#7F77DD;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg-primary:#1c1c1e;--bg-secondary:#2c2c2e;--bg-tertiary:#3a3a3c;
      --text-primary:#f2f2f7;--text-secondary:#aeaeb2;--text-tertiary:#6e6e73;
      --border:rgba(255,255,255,0.1);--border-md:rgba(255,255,255,0.2);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg-tertiary);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem 3rem;color:var(--text-primary);}
  .wrap{width:100%;max-width:680px;}
  .page-title{font-size:18px;font-weight:500;color:var(--text-primary);margin-bottom:1.25rem;}
  .filter-section{margin-bottom:1rem;}
  .filter-group-label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-tertiary);font-weight:500;margin-bottom:6px;}
  .filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .mode-row{display:flex;gap:6px;margin-bottom:8px;}
  .mbtn{font-size:12px;padding:5px 14px;border-radius:999px;border:0.5px solid var(--border-md);background:var(--bg-primary);color:var(--text-secondary);cursor:pointer;font-family:inherit;transition:all 0.15s;}
  .mbtn.active{background:var(--purple);color:#fff;border-color:var(--purple);}
  .sr-badge{font-size:10px;background:var(--purple-light);color:var(--purple);padding:2px 8px;border-radius:999px;margin-left:6px;font-weight:500;}
  .fbtn{font-size:12px;padding:4px 12px;border-radius:999px;border:0.5px solid var(--border-md);background:var(--bg-primary);color:var(--text-secondary);cursor:pointer;transition:all 0.15s;font-family:inherit;}
  .fbtn.active{color:#fff;border-color:transparent;}
  .filter-actions{display:flex;gap:10px;margin-top:4px;}
  .faction{font-size:12px;color:var(--text-secondary);background:none;border:none;cursor:pointer;text-decoration:underline;font-family:inherit;}
  .stats-row{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;}
  .stat{background:var(--bg-secondary);border-radius:var(--radius-md);padding:5px 10px;font-size:12px;color:var(--text-secondary);}
  .stat span{font-weight:500;color:var(--text-primary);}
    .prog-wrap{display:flex;align-items:center;gap:10px;margin-bottom:1rem;}
  .prog-bg{flex:1;height:6px;background:var(--bg-secondary);border-radius:3px;overflow:hidden;display:flex;gap:1px;}
  .prog-seg{height:100%;border-radius:2px;transition:width 0.3s;}
  .prog-txt{font-size:13px;color:var(--text-secondary);white-space:nowrap;}
  .card{border-radius:var(--radius-lg);padding:1.75rem;margin-bottom:1rem;cursor:pointer;min-height:280px;display:flex;flex-direction:column;}
  .card-front{background:var(--bg-primary);border:0.5px solid var(--border);align-items:center;justify-content:center;}
  .card-back{justify-content:flex-start;}
  .front-cat{font-size:11px;text-transform:uppercase;letter-spacing:0.09em;margin-bottom:6px;font-weight:500;}
  .front-region{font-size:11px;letter-spacing:0.04em;margin-bottom:10px;opacity:0.7;}
  .front-title{font-size:24px;font-weight:500;color:var(--text-primary);line-height:1.2;text-align:center;}
  .hint{font-size:13px;color:var(--text-tertiary);margin-top:1.25rem;}
  .back-title{font-size:19px;font-weight:500;margin-bottom:6px;}
  .badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .type-badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;font-weight:500;}
  .region-badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--bg-secondary);color:var(--text-secondary);}
  .divider{height:0.5px;margin-bottom:14px;}
  .blbl{font-size:11px;text-transform:uppercase;letter-spacing:0.07em;font-weight:500;margin-bottom:6px;}
  .bval{font-size:14px;line-height:1.7;} .bval b{font-weight:600;}
  .spacer{flex:1;}
  .confidence-row{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;flex-wrap:wrap;}
  .conf-lbl{font-size:12px;font-weight:500;margin-right:2px;}
  .cbtn{font-size:12px;padding:5px 14px;border-radius:999px;border:0.5px solid;cursor:pointer;font-weight:500;font-family:inherit;}
  .cbtn-nope{background:#FCEBEB;color:#A32D2D;border-color:#F09595;}
  .cbtn-almost{background:#FAEEDA;color:#854F0B;border-color:#EF9F27;}
  .cbtn-gotit{background:#E1F5EE;color:#0F6E56;border-color:#5DCAA5;}
  .cbtn.selected{outline:2px solid currentColor;outline-offset:1px;}
  .remove-btn{margin-left:auto;font-size:12px;padding:5px 12px;border-radius:999px;border:0.5px solid #5DCAA5;background:#E1F5EE;color:#0F6E56;cursor:pointer;font-weight:500;font-family:inherit;}
  .flip-hint{text-align:center;margin-top:12px;font-size:12px;}
  .conf-badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;font-weight:500;margin-top:10px;}
  .btn-row{display:flex;gap:10px;justify-content:center;margin-bottom:8px;}
  .nbtn{padding:8px 22px;font-size:14px;border-radius:var(--radius-md);border:0.5px solid var(--border-md);background:var(--bg-primary);color:var(--text-primary);cursor:pointer;font-family:inherit;}
  .nbtn:hover{background:var(--bg-secondary);}
  .nbtn.primary{background:#7F77DD;color:#fff;border-color:#7F77DD;}
  .nbtn.primary:hover{background:#534AB7;}
    .bottom-row{display:flex;gap:8px;justify-content:center;margin-top:6px;flex-wrap:wrap;}
  .nbtn.secondary{background:var(--bg-primary);color:var(--text-secondary);border-color:var(--border-md);}
  .nbtn.secondary:hover{background:var(--bg-secondary);color:var(--text-primary);}
  .nbtn.finish{background:#FCEBEB;color:#A32D2D;border-color:#F09595;}
  .nbtn.finish:hover{background:#f9d9d9;}
  .empty-state{text-align:center;padding:3rem 1rem;color:var(--text-secondary);font-size:14px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:1rem;background:var(--bg-primary);}
  .empty-state strong{display:block;font-size:16px;color:var(--text-primary);margin-bottom:8px;font-weight:500;}
  .sync-bar{display:flex;align-items:center;gap:6px;margin-bottom:0.75rem;font-size:12px;color:var(--text-tertiary);}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:#c8c6c3;flex-shrink:0;transition:background 0.3s;}
  .sync-dot.ok{background:#5DCAA5;}
  .sync-dot.err{background:#F09595;}
  .sync-dot.pending{background:#EF9F27;}
</style>
</head>
<body>
<div class="wrap">
  <div class="page-title">MSK flashcards — NPTE</div>
  <div class="sync-bar"><div class="sync-dot" id="syncDot"></div><span id="syncTxt">Connecting...</span></div>

    <div class="mode-row" id="modeRow">
    <button class="mbtn active" id="mode-all" onclick="setMode('all')">All</button>
    <button class="mbtn" id="mode-weak" onclick="setMode('weak')">Weak spots</button>
    <button class="mbtn" id="mode-unseen" onclick="setMode('unseen')">Unseen</button>
  </div>
  <div class="filter-section">
    <div class="filter-group-label">Category</div>
    <div class="filter-row" id="catFilters"></div>
    <div class="filter-group-label">Region</div>
    <div class="filter-row" id="regionFilters"></div>
    <div class="filter-group-label">Confidence</div>
    <div class="filter-row" id="confFilters"></div>
    <div class="filter-actions">
      <button class="faction" onclick="selectAll()">Select all</button>
      <button class="faction" onclick="clearAll()">Clear all</button>
    </div>
  </div>
  <div class="stats-row" id="statsRow"></div>
  <div class="prog-wrap">
    <div class="prog-bg" id="progBar"></div>
    <div class="prog-txt" id="progTxt"></div>
  </div>
  <div id="cardArea"></div>
  <div class="btn-row" id="navRow">
    <button class="nbtn" onclick="go(-1)">← Prev</button>
    <button class="nbtn primary" onclick="go(1)">Next →</button>
  </div>
  <div class="bottom-row">
    <button class="nbtn secondary" onclick="shuffle()">Shuffle</button>
    <button class="nbtn secondary" onclick="resetDeck()">Reset deck</button>
    <a class="nbtn finish" href="#" onclick="finishStudying(event)" style="text-decoration:none;display:inline-flex;align-items:center;">Finish studying</a>
  </div>
</div>
<script>
const CATS={
  pathology: {label:"Pathology",      dot:"#E24B4A",bg:"#FCEBEB",border:"#F09595",text:"#791F1F",badge_bg:"#FCEBEB",badge_color:"#A32D2D"},
  special:   {label:"Special test",   dot:"#7F77DD",bg:"#EEEDFE",border:"#AFA9EC",text:"#3C3489",badge_bg:"#EEEDFE",badge_color:"#534AB7"},
  biomech:   {label:"Biomechanics",   dot:"#1D9E75",bg:"#E1F5EE",border:"#5DCAA5",text:"#085041",badge_bg:"#E1F5EE",badge_color:"#0F6E56"},
  postop:    {label:"Post-op / rehab",dot:"#BA7517",bg:"#FAEEDA",border:"#EF9F27",text:"#633806",badge_bg:"#FAEEDA",badge_color:"#854F0B"},
};
const REGIONS={
  shoulder:"Shoulder",elbow:"Elbow",wrist:"Wrist / hand",
  hip:"Hip",knee:"Knee",ankle:"Ankle / foot",spine:"Spine",
};
const REGION_COLORS={
  shoulder:"#534AB7",elbow:"#185FA5",wrist:"#0F6E56",
  hip:"#993C1D",knee:"#A32D2D",ankle:"#854F0B",spine:"#5F5E5A",
};

const CARDS=[
  // ── SHOULDER PATHOLOGY ──
  {cat:"pathology",region:"shoulder",front:"Rotator cuff tear — full thickness",back:"Supraspinatus most common.<br><b>Presentation:</b> painful arc 60–120°, weakness empty can, drop arm positive.<br><b>Full thickness:</b> significant empty can weakness (≤3/5), drop arm positive.<br><b>Partial:</b> pain with testing, strength relatively preserved.<br><b>Dx:</b> MRI gold standard."},
  {cat:"pathology",region:"shoulder",front:"Subacromial impingement syndrome",back:"Compression of supraspinatus/bursa under coracoacromial arch.<br><b>Signs:</b> painful arc 60–120°, positive Hawkins-Kennedy and Neer.<br><b>Tx:</b> RC strengthening (ER focus), scapular stabilization, posterior capsule stretching. Avoid painful arc early."},
  {cat:"pathology",region:"shoulder",front:"Adhesive capsulitis (frozen shoulder)",back:"<b>Stages:</b> I Painful (0–3 mo) → II Freezing (3–9 mo) → III Frozen (9–15 mo) → IV Thawing (15–24 mo).<br><b>Capsular pattern:</b> ER &gt; Abd &gt; IR. Equal AROM/PROM loss.<br><b>Associated with:</b> diabetes, hypothyroidism, prolonged immobilization.<br><b>Tx:</b> Grade III–IV joint mobilization (thawing), stretching, patient education on timeline."},
  {cat:"pathology",region:"shoulder",front:"Glenohumeral instability",back:"<b>Anterior (95%):</b> apprehension with ER/Abd. Positive apprehension + relocation test. Bankart lesion = classic structural injury.<br><b>Posterior:</b> pain with forward flexion/IR/adduction.<br><b>MDI:</b> sulcus sign, generalized laxity — all directions."},
  {cat:"pathology",region:"shoulder",front:"SLAP tear",back:"Superior labrum anterior-to-posterior tear.<br><b>Mechanism:</b> overhead throwing, FOOSH, traction.<br><b>Positive:</b> O'Brien's test (pain thumb-down, relieved thumb-up), Speed's, Biceps load II.<br>Conservative first; surgical if conservative fails."},
  {cat:"pathology",region:"shoulder",front:"AC joint sprain — classification",back:"<b>Type I:</b> sprain AC, intact CC — no deformity.<br><b>Type II:</b> torn AC, sprained CC — mild step deformity.<br><b>Type III:</b> torn AC + CC — obvious deformity, 25–100% CC widening.<br><b>Types I–II:</b> conservative. <b>III:</b> controversial. <b>IV–VI:</b> surgical."},
  {cat:"pathology",region:"shoulder",front:"Biceps tendinopathy / rupture",back:"Long head biceps: anterior shoulder pain in bicipital groove, worse overhead.<br><b>Positive:</b> Speed's (resisted shoulder flexion, elbow extended, forearm supinated) and Yergason's (resisted supination, elbow flexed).<br><b>Rupture:</b> 'Popeye' deformity — may treat conservatively in older patients."},

  // ── SHOULDER SPECIAL TESTS ──
  {cat:"special",region:"shoulder",front:"Hawkins-Kennedy test",back:"Shoulder + elbow at 90° → passively IR.<br><b>Positive:</b> pain = subacromial impingement (supraspinatus compressed against coracoacromial ligament).<br><b>Sensitivity ~79%</b> — best for ruling out impingement."},
  {cat:"special",region:"shoulder",front:"Empty can (Jobe) test",back:"90° shoulder flexion, 30° horizontal adduction (scapular plane), full IR (thumb down) → resist downward.<br><b>Positive:</b> pain or weakness = supraspinatus pathology.<br><b>Full can</b> (thumb up): better for isolated strength testing — reduces impingement pain."},
  {cat:"special",region:"shoulder",front:"Drop arm test",back:"Patient slowly lowers arm from 90° abduction.<br><b>Positive:</b> arm drops suddenly or cannot lower smoothly = full-thickness RC tear.<br><b>Specificity ~97%</b> — if positive, very likely full-thickness. Low sensitivity."},
  {cat:"special",region:"shoulder",front:"Apprehension and relocation test",back:"<b>Apprehension:</b> supine, 90° Abd/ER → patient fearful of anterior dislocation = anterior instability.<br><b>Relocation:</b> posterior pressure on proximal humerus relieves apprehension = confirms anterior instability.<br>Most specific combination for anterior GH instability."},
  {cat:"special",region:"shoulder",front:"O'Brien's test (active compression)",back:"90° flexion, 15° horizontal adduction, full IR (thumb down) → resist downward. Repeat with full ER (thumb up).<br><b>Positive SLAP:</b> pain/click thumb-down, relieved thumb-up.<br><b>Positive AC joint:</b> pain on top of shoulder with both positions."},
  {cat:"special",region:"shoulder",front:"Sulcus sign",back:"Seated, arm at side → inferior traction on humerus.<br><b>Positive:</b> sulcus below acromion &gt;1 cm = inferior GH instability / MDI.<br>Grade I: &lt;1 cm | Grade II: 1–2 cm | Grade III: &gt;2 cm."},

  // ── SHOULDER BIOMECHANICS ──
  {cat:"biomech",region:"shoulder",front:"Scapulohumeral rhythm",back:"<b>2:1 ratio:</b> 180° elevation = 120° GH + 60° scapular upward rotation.<br><b>Primary upward rotators:</b> serratus anterior and lower trapezius.<br>Altered rhythm (dyskinesis) → ↑ impingement risk."},
  {cat:"biomech",region:"shoulder",front:"GH joint — convex-concave rule",back:"Humeral head (convex) on glenoid (concave) → roll and glide in opposite directions.<br><b>Shoulder abduction:</b> head rolls superiorly, glides inferiorly.<br><b>Mobilization for abduction:</b> inferior glide.<br><b>Posterior capsule tightness:</b> restricts IR and horizontal adduction."},
  {cat:"biomech",region:"shoulder",front:"Rotator cuff — force couple",back:"Deltoid pulls superiorly — balanced by inferior pull of subscapularis, infraspinatus, teres minor.<br>Without balance → superior humeral migration → impingement.<br>Supraspinatus initiates abduction (0–15°); deltoid dominant above 15°."},

  // ── SHOULDER POST-OP ──
  {cat:"postop",region:"shoulder",front:"Rotator cuff repair — protocol",back:"<b>Phase I (0–6 wk):</b> sling, pendulums, PROM only.<br><b>Phase II (6–12 wk):</b> AAROM → AROM, scapular stabilization.<br><b>Phase III (12–16 wk):</b> progressive strengthening.<br><b>Phase IV (4–6 mo):</b> sport/work-specific.<br>No resisted ER/IR until 6–8 weeks minimum. Return to sport: 6–12 months."},
  {cat:"postop",region:"shoulder",front:"Total shoulder arthroplasty — precautions",back:"<b>Traditional TSA</b> (subscapularis repair, 6 wk): no passive ER &gt;40°, no active IR against resistance, no extension behind back.<br><b>Reverse TSA</b> (rotator cuff arthropathy): no subscapularis repair — avoid combined adduction/IR (dislocation position)."},

  // ── ELBOW PATHOLOGY ──
  {cat:"pathology",region:"elbow",front:"Lateral epicondylalgia (tennis elbow)",back:"ECRB tendinopathy at lateral epicondyle — angiofibroblastic dysplasia, not true inflammation.<br><b>Positive:</b> Cozen's and Mill's tests.<br><b>Best long-term Tx:</b> heavy slow resistance (HSR) loading 8–12 weeks.<br><b>Cortisone:</b> best short-term, worse outcomes at 12 months vs. wait-and-see."},
  {cat:"pathology",region:"elbow",front:"Medial epicondylalgia (golfer's elbow)",back:"Common flexor-pronator tendon at medial epicondyle.<br><b>Pain:</b> resisted wrist flexion and pronation.<br><b>Screen for:</b> ulnar nerve involvement (ring/small tingling = cubital tunnel), UCL sprain (valgus stress test).<br><b>Tx:</b> same HSR loading principle as lateral."},
  {cat:"pathology",region:"elbow",front:"UCL sprain (medial collateral ligament)",back:"Overhead throwing athletes — valgus stress at late cocking phase.<br><b>Positive:</b> valgus stress test at 25–30° flexion, milking maneuver.<br><b>Surgical:</b> Tommy John (UCL reconstruction) for high-level throwers.<br>Post-op return to throwing: 12–18 months."},
  {cat:"pathology",region:"elbow",front:"Cubital tunnel syndrome",back:"Ulnar nerve compression at medial elbow.<br><b>Symptoms:</b> ring/small finger numbness, intrinsic weakness, claw (4th/5th digits).<br><b>Positive:</b> Tinel's at cubital tunnel, elbow flexion test (sustained flexion reproduces symptoms).<br><b>Tx:</b> elbow pad, avoid sustained flexion, nerve gliding. Surgical if conservative fails."},
  {cat:"pathology",region:"elbow",front:"Radial tunnel syndrome",back:"PIN (posterior interosseous nerve) compression in radial tunnel.<br><b>Tenderness:</b> 4–5 cm distal to lateral epicondyle (vs. epicondyle itself in lateral epicondylalgia).<br><b>Pain with:</b> resisted supination + middle finger extension. No true motor deficit.<br>Often misdiagnosed as lateral epicondylalgia."},

  // ── ELBOW SPECIAL TESTS ──
  {cat:"special",region:"elbow",front:"Cozen's test",back:"Fist, pronated forearm, radially deviated wrist, extend wrist against resistance.<br><b>Positive:</b> pain at lateral epicondyle = lateral epicondylalgia.<br><b>Mill's test:</b> passive wrist flexion with elbow extended and forearm pronated → lateral epicondyle pain."},
  {cat:"special",region:"elbow",front:"Valgus stress test (elbow)",back:"Elbow flexed 25–30° (unlocks olecranon) → apply valgus force.<br><b>Positive:</b> medial pain or laxity = UCL sprain. Compare bilaterally.<br><b>Moving valgus stress test</b> (arc of pain 70–120°): more sensitive for UCL in throwers."},

  // ── ELBOW BIOMECHANICS ──
  {cat:"biomech",region:"elbow",front:"Elbow carrying angle and valgus",back:"<b>Normal carrying angle:</b> 5–15° valgus (females &gt; males).<br><b>Cubitus valgus (&gt;15°):</b> ↑ ulnar nerve stretch risk.<br><b>Cubitus varus:</b> common supracondylar fracture malunion in children ('gunstock').<br>Close-packed: full extension + supination. Resting: 70° flexion, 10° supination."},
  {cat:"biomech",region:"elbow",front:"Forearm pronation/supination",back:"Axis: radial head to distal ulna (DRUJ).<br><b>Supinators:</b> supinator + biceps. <b>Pronators:</b> pronator teres + pronator quadratus.<br>Pronator quadratus: active at all speeds. Pronator teres: fast/resisted pronation.<br>Supination is stronger than pronation."},

  // ── WRIST / HAND PATHOLOGY ──
  {cat:"pathology",region:"wrist",front:"de Quervain's tenosynovitis",back:"Stenosing tenosynovitis of APL and EPB in first dorsal compartment.<br><b>Pain:</b> radial wrist with thumb motion.<br><b>Positive:</b> Finkelstein test (thumb in fist, ulnar deviation → pain).<br><b>Tx:</b> thumb spica splint, activity modification, corticosteroid injection, HSR loading."},
  {cat:"pathology",region:"wrist",front:"Scaphoid fracture",back:"Most common carpal fracture. Mechanism: FOOSH.<br><b>Signs:</b> anatomical snuffbox tenderness, axial load through thumb.<br><b>Note:</b> X-ray may be negative initially — MRI/CT if suspected. Proximal pole at risk for AVN (blood supply enters distally).<br><b>Tx:</b> undisplaced = thumb spica 8–12 weeks. Proximal pole: often surgical."},
  {cat:"pathology",region:"wrist",front:"TFCC tear",back:"Stabilizes DRUJ, absorbs ulnar load.<br><b>Mechanism:</b> forced pronation/supination or FOOSH.<br><b>Signs:</b> ulnar-sided wrist pain, piano key sign (DRUJ instability), ulnar fovea sign positive.<br><b>Class 1</b> (traumatic): surgical if unstable. <b>Class 2</b> (degenerative): conservative."},
  {cat:"pathology",region:"wrist",front:"Dupuytren's contracture",back:"Fibroproliferative disorder of palmar fascia → progressive PIP flexion contracture (ring and small most common). Not a tendon problem.<br><b>Risk factors:</b> Northern European descent, male, diabetes, alcohol.<br><b>Tx:</b> needle aponeurotomy, collagenase injection, or surgical fasciectomy when MCP &gt;30° or PIP involved."},
  {cat:"pathology",region:"wrist",front:"Mallet finger",back:"Terminal extensor tendon disruption at DIP — forced flexion of extended DIP. Cannot actively extend DIP.<br><b>Tx:</b> DIP splint in full extension 6–8 weeks continuous (including during hygiene). PIP must remain free.<br>Non-compliance = restart the 6–8 week clock."},
  {cat:"pathology",region:"wrist",front:"Trigger finger",back:"A1 pulley stenosis → flexor tendon catches or locks in flexion. Ring and middle most common.<br><b>Signs:</b> catching, popping, or locking with finger flexion/extension.<br><b>Tx:</b> corticosteroid injection (most effective), MCP extension splinting. Surgical A1 pulley release if conservative fails."},

  // ── WRIST SPECIAL TESTS ──
  {cat:"special",region:"wrist",front:"Phalen's and Tinel's — wrist",back:"<b>Phalen's:</b> sustained wrist flexion 60 sec → median nerve symptoms. Sensitivity ~68%.<br><b>Tinel's:</b> percussion over carpal tunnel → symptoms. Specificity ~73%.<br>Both positive together ↑ diagnostic accuracy for CTS."},
  {cat:"special",region:"wrist",front:"Finkelstein test",back:"Thumb in palm, fingers wrap over thumb → examiner passively ulnar deviates wrist.<br><b>Positive:</b> sharp pain over first dorsal compartment (APL/EPB) = de Quervain's.<br>High sensitivity, low specificity. (Eichhoff variant is technically what's commonly performed.)"},
  {cat:"special",region:"wrist",front:"Watson's test (scaphoid shift)",back:"Thumb on scaphoid tubercle (volar), fingers on dorsal wrist → passively move ulnar to radial deviation under pressure.<br><b>Positive:</b> clunk or pain as scaphoid subluxes dorsally = scapholunate ligament tear.<br>Compare bilaterally — some laxity is normal."},

  // ── HIP PATHOLOGY ──
  {cat:"pathology",region:"hip",front:"Hip osteoarthritis",back:"<b>Capsular pattern:</b> IR &gt; Abd &gt; Flexion.<br><b>Referred pain:</b> groin, anterior thigh, medial knee.<br>Painful restricted hip IR = most sensitive clinical finding.<br><b>Tx:</b> strengthening, aquatic therapy, gait aids. THA when conservative fails."},
  {cat:"pathology",region:"hip",front:"Femoroacetabular impingement (FAI)",back:"<b>CAM:</b> aspherical femoral head → impingement with flexion/IR.<br><b>PINCER:</b> acetabular overcoverage. Mixed = most common.<br><b>Positive:</b> FADIR test. Young active adults.<br><b>Tx:</b> activity modification, strengthening, posterior capsule stretching. Arthroscopic reshaping if conservative fails."},
  {cat:"pathology",region:"hip",front:"Greater trochanteric pain syndrome (GTPS)",back:"Gluteus medius tendinopathy at greater trochanter.<br><b>Pain:</b> lateral hip with side-lying, stairs, single-leg stance. Positive Trendelenburg.<br><b>Avoid:</b> crossing legs, adduction stretching (increases tendon compression).<br><b>Tx:</b> progressive loading (isometric → isotonic → single-leg), gait retraining to ↓ hip adduction."},
  {cat:"pathology",region:"hip",front:"Piriformis / deep gluteal syndrome",back:"Sciatic nerve compression by piriformis in deep gluteal space.<br><b>Key features:</b> buttock pain radiating posteriorly, SLR negative, no dermatomal pattern.<br><b>Positive:</b> FAIR test (flexion/adduction/IR). Tenderness midpoint between PSIS and greater trochanter.<br><b>Tx:</b> stretching, dry needling, neural mobilization."},
  {cat:"pathology",region:"hip",front:"Hip labral tear",back:"Anterior labrum most common. Mechanism: FAI, repetitive hip flexion/rotation.<br><b>Signs:</b> C-sign, positive FADIR, clicking/locking, anterior hip/groin pain.<br><b>Dx:</b> MR arthrogram gold standard.<br><b>Tx:</b> activity modification, strengthening. Arthroscopic repair if conservative fails."},
  {cat:"pathology",region:"hip",front:"Snapping hip (coxa saltans)",back:"<b>External:</b> IT band over greater trochanter — lateral snap.<br><b>Internal:</b> iliopsoas over iliopectineal eminence — anterior snap (audible).<br><b>Intra-articular:</b> labral tear or loose body.<br><b>Tx:</b> external/internal types → stretching + strengthening. Avoid provocative movements initially."},

  // ── HIP SPECIAL TESTS ──
  {cat:"special",region:"hip",front:"FABER test (Patrick's test)",back:"Flexion, Abduction, External Rotation — figure-4 position.<br><b>Positive anterior groin:</b> hip pathology (OA, labral tear).<br><b>Positive lateral hip/SI:</b> SIJ dysfunction.<br>Not specific — screens for multiple structures."},
  {cat:"special",region:"hip",front:"FADIR test",back:"Flexion, Adduction, Internal Rotation.<br><b>Positive:</b> anterior hip/groin pain = FAI or labral pathology.<br>Most sensitive test for FAI and labral tears. Low specificity — use alongside imaging."},
  {cat:"special",region:"hip",front:"Trendelenburg test",back:"Single-leg stance on test limb → observe contralateral pelvis.<br><b>Positive:</b> contralateral pelvis drops = ipsilateral glute med weakness or superior gluteal nerve lesion.<br><b>Gait:</b> Trendelenburg pattern = lateral trunk lean toward weak side to compensate."},
  {cat:"special",region:"hip",front:"Thomas test",back:"Supine, pull one knee to chest → observe opposite hip.<br><b>Positive:</b> opposite hip flexes off table = hip flexor tightness (iliopsoas) on that side.<br><b>Modified Thomas:</b> hip at table edge — quantifies hip flexion, knee extension, abduction/ER (assesses rectus femoris and TFL)."},

  // ── HIP BIOMECHANICS ──
  {cat:"biomech",region:"hip",front:"Hip joint — force and loading",back:"<b>Joint reactive force:</b> 2.5× BW walking | 3× BW stairs | 8–10× BW running.<br><b>Abductor mechanism:</b> glute med generates 2–3× BW across joint to prevent pelvic drop.<br><b>Contralateral cane:</b> reduces hip joint force up to 40%."},
  {cat:"biomech",region:"hip",front:"Legg-Calvé-Perthes vs SCFE",back:"<b>LCP:</b> AVN femoral head, age 4–8, males, painless limp, limited IR/Abd.<br><b>SCFE:</b> femoral head slips posteriorly, age 10–16, obese adolescents, obligate ER with hip flexion — NWB until surgically pinned.<br>Both: urgent referral."},

  // ── HIP POST-OP ──
  {cat:"postop",region:"hip",front:"Total hip arthroplasty — posterior approach",back:"<b>Precautions (6–12 wk):</b> no hip flexion &gt;90°, no IR, no adduction past midline.<br><b>Avoid:</b> low chairs, crossing legs — use raised toilet seat.<br><b>Anterior approach:</b> fewer/no posterior precautions, different muscle recovery profile."},
  {cat:"postop",region:"hip",front:"Total hip arthroplasty — rehab progression",back:"<b>Day 1:</b> WBAT (cemented) or TTWB (cementless).<br><b>Week 1–2:</b> gait training, transfers, ADLs.<br><b>Week 4–6:</b> progressive strengthening, wean assistive device.<br><b>Return to driving:</b> right hip 6 wks, left 4 wks (automatic). Low-impact activity: 3–6 months."},

  // ── KNEE PATHOLOGY ──
  {cat:"pathology",region:"knee",front:"ACL tear",back:"<b>Mechanism:</b> non-contact deceleration, pivoting, valgus collapse. Pop + rapid effusion.<br><b>Positive:</b> Lachman (most sensitive), anterior drawer, pivot shift (most specific).<br><b>Reconstruction grafts:</b> patellar tendon (strongest), hamstring, allograft.<br><b>Return to sport:</b> ≥9–12 months, criteria-based (&gt;90% LSI + ACL-RSI clearance)."},
  {cat:"pathology",region:"knee",front:"Meniscus tear",back:"Medial more common (less mobile). Mechanism: twisting on planted foot.<br><b>Positive:</b> joint line tenderness, McMurray (click with flexion/rotation), Thessaly (most sensitive).<br><b>Conservative:</b> degenerative tears in older adults.<br><b>Surgical:</b> displaced bucket-handle (locked knee = urgent), peripheral tears in young active patients."},
  {cat:"pathology",region:"knee",front:"PCL tear",back:"<b>Mechanism:</b> dashboard injury, fall on bent knee.<br><b>Positive:</b> posterior drawer, posterior sag sign, quadriceps active test.<br><b>Isolated PCL:</b> often conservative (quad strengthening).<br><b>Combined with PLC:</b> surgical."},
  {cat:"pathology",region:"knee",front:"MCL sprain",back:"<b>Grade I:</b> sprain, no laxity. <b>II:</b> partial, some laxity, firm endpoint. <b>III:</b> complete, no endpoint.<br><b>Mechanism:</b> valgus force.<br>Positive valgus stress at 0° and 30° (0° involvement = capsule + MCL).<br>Almost always conservative — excellent healing due to good blood supply."},
  {cat:"pathology",region:"knee",front:"Patellofemoral pain syndrome (PFPS)",back:"Anterior knee pain with prolonged sitting (theater sign), stairs, squatting. No effusion typically.<br><b>Contributing factors:</b> weak VMO, hip abductor weakness, excessive foot pronation, tight lateral structures.<br><b>Tx:</b> hip strengthening (primary), quad strengthening, patellar taping (McConnell), foot orthoses."},
  {cat:"pathology",region:"knee",front:"Patellar tendinopathy",back:"Insertional tendinopathy at inferior patellar pole — jumping athletes ('jumper's knee').<br><b>Pain:</b> stairs, jumping, squatting. Outcome measure: VISA-P.<br><b>Tx:</b> HSR or decline squat eccentric program. Avoid tendon stretching in early stages."},
  {cat:"pathology",region:"knee",front:"IT band syndrome",back:"Lateral knee pain in runners — IT band friction over lateral femoral epicondyle at ~30° flexion.<br><b>Positive:</b> Ober's test, Noble compression test (lateral femoral epicondyle).<br><b>Tx:</b> ↓ training load, hip abductor strengthening, address training errors."},
  {cat:"pathology",region:"knee",front:"Knee OA",back:"Medial compartment most common. Progressive varus deformity.<br><b>Capsular pattern:</b> flexion &gt; extension.<br><b>Signs:</b> crepitus, bony enlargement, joint line tenderness.<br><b>Tx:</b> quad + hip strengthening (primary), weight loss, aquatic therapy, unloader brace (medial OA). TKA when conservative fails."},

  // ── KNEE SPECIAL TESTS ──
  {cat:"special",region:"knee",front:"Lachman test",back:"Knee at 20–30° flexion → stabilize femur, translate tibia anteriorly.<br><b>Positive:</b> excessive anterior translation with soft/absent endpoint = ACL tear.<br><b>Sensitivity ~85%</b> — most sensitive ACL test. More sensitive than anterior drawer (90° too flexed)."},
  {cat:"special",region:"knee",front:"McMurray test",back:"Fully flex knee. <b>Medial:</b> ER tibia, extend → pain/click at medial joint line. <b>Lateral:</b> IR tibia, extend → lateral joint line.<br><b>Sensitivity ~53%, specificity ~59%.</b> Combine with joint line tenderness for better accuracy."},
  {cat:"special",region:"knee",front:"Valgus / varus stress tests (knee)",back:"<b>Valgus (MCL):</b> valgus force at 0° and 30°. Positive at 30° only = MCL. Positive at both = MCL + posterior capsule.<br><b>Varus (LCL):</b> varus force at same positions.<br>Laxity grades: I (&lt;5mm) | II (5–10mm) | III (&gt;10mm, no endpoint)."},
  {cat:"special",region:"knee",front:"Thessaly test",back:"Single-leg stance at 20° knee flexion → IR/ER body/knee.<br><b>Positive:</b> medial/lateral joint line pain or locking = meniscal pathology.<br><b>Sensitivity ~89%, specificity ~97%</b> — highest of all meniscal tests."},
  {cat:"special",region:"knee",front:"Ober's test",back:"Side-lying → abduct and extend upper hip, then allow adduction.<br><b>Positive:</b> leg remains abducted (doesn't adduct to table) = IT band / TFL tightness.<br><b>Modified Ober:</b> knee extended = tests IT band more specifically."},

  // ── KNEE BIOMECHANICS ──
  {cat:"biomech",region:"knee",front:"Patellofemoral joint mechanics",back:"<b>PFJ force:</b> 0.5× BW walking | 3.3× BW stairs | 7–8× BW deep squat.<br>Patella increases quad mechanical advantage 50%.<br><b>Q-angle:</b> normal &lt;15° (male), &lt;20° (female). ↑ Q-angle → lateral tracking → PFPS risk.<br>VMO fires first — critical for medial stability."},
  {cat:"biomech",region:"knee",front:"Knee screw-home mechanism",back:"Terminal 10–15° of extension: tibia ER (screw-home). Popliteus IR tibia to unlock at initiation of flexion.<br>Passive mechanism from medial femoral condyle geometry.<br>Popliteus injury → impaired unlocking → posterolateral instability."},
  {cat:"biomech",region:"knee",front:"Tibiofemoral — convex-concave rule",back:"Femur (convex) on tibia (concave) → roll and glide opposite directions.<br><b>Flexion:</b> femur rolls posteriorly, glides anteriorly.<br><b>Extension:</b> femur rolls anteriorly, glides posteriorly.<br><b>Mobilization:</b> flexion loss → posterior tibial glide. Extension loss → anterior tibial glide."},

  // ── KNEE POST-OP ──
  {cat:"postop",region:"knee",front:"ACL reconstruction — phases",back:"<b>0–2 wk:</b> quad sets, SLR, ROM 0–90°.<br><b>2–6 wk:</b> closed chain strengthening, gait normalization, full ROM.<br><b>6–12 wk:</b> progressive strengthening, proprioception, cycling.<br><b>3–6 mo:</b> sport-specific, plyometrics.<br><b>6–12 mo:</b> criteria-based return to sport (not time-based)."},
  {cat:"postop",region:"knee",front:"Total knee arthroplasty (TKA) — rehab",back:"<b>Day 1:</b> WBAT, quad sets, ankle pumps.<br><b>Goals:</b> 0° extension (critical — prioritize early), 90° by discharge, 110–120° by 6 weeks.<br>Flexion contracture = worst outcome.<br><b>Return to driving:</b> 4–6 weeks. Low-impact activity: 3–6 months."},
  {cat:"postop",region:"knee",front:"Meniscus repair vs meniscectomy",back:"<b>Repair</b> (peripheral, young, good blood supply): NWB 4–6 wk, avoid full flexion 12 wk. Return to sport: 4–6 months.<br><b>Meniscectomy</b> (degenerative/complex): WBAT immediately. Return: 6–8 weeks.<br>Long-term: meniscectomy ↑ OA risk — preserve when possible."},

  // ── ANKLE / FOOT PATHOLOGY ──
  {cat:"pathology",region:"ankle",front:"Lateral ankle sprain",back:"ATFL most commonly injured (PF + inversion).<br><b>Grades:</b> I (stretch, no laxity) | II (partial, some laxity) | III (complete, no endpoint).<br><b>Ottawa rules:</b> X-ray if posterior malleolus tip or 5th MT base or navicular tenderness, or inability to WB.<br><b>Tx:</b> PEACE &amp; LOVE protocol. Chronic: strengthening + proprioception."},
  {cat:"pathology",region:"ankle",front:"Achilles tendinopathy",back:"<b>Midportion</b> (2–6 cm proximal to insertion) vs insertional.<br><b>Dx:</b> Royal London Hospital test (pain ↓ with passive PF). Outcome: VISA-A.<br><b>Midportion Tx:</b> Alfredson eccentric OR HSR — both evidence-based.<br><b>Insertional:</b> avoid end-range PF and heel drops below neutral."},
  {cat:"pathology",region:"ankle",front:"Plantar fasciitis",back:"Insertional heel pain worst with first steps in morning (post-static dyskinesia). Medial calcaneal tubercle tenderness.<br><b>Risk factors:</b> DF &lt;10°, high BMI, prolonged standing, pes planus/cavus.<br><b>Tx:</b> calf stretching, plantar fascia stretching, night splints, orthoses, progressive loading."},
  {cat:"pathology",region:"ankle",front:"Syndesmosis sprain (high ankle sprain)",back:"Injury to distal tibiofibular syndesmosis. Mechanism: ER/dorsiflexion.<br><b>Positive:</b> squeeze test (fibula compression at mid-shaft → distal pain), external rotation stress test.<br>Slower recovery than lateral sprain.<br><b>Unstable:</b> surgical fixation. Stable: protected WB, return 8–12+ weeks."},
  {cat:"pathology",region:"ankle",front:"Posterior tibial tendon dysfunction (PTTD)",back:"Progressive flatfoot deformity in middle-aged adults.<br><b>Signs:</b> too-many-toes sign (forefoot abduction from behind), positive single heel rise test.<br><b>Stages:</b> I (pain, no deformity) | II (flexible flatfoot) | III (rigid) | IV (ankle valgus).<br>PT effective Stage I–II. Stage III–IV: surgical."},
  {cat:"pathology",region:"ankle",front:"Morton's neuroma",back:"Perineural fibrosis of digital nerve — most common between 3rd and 4th MT heads.<br><b>Signs:</b> burning/tingling plantar forefoot. Mulder's click (transverse MT compression).<br>Worse with tight shoes.<br><b>Tx:</b> wide toe box, metatarsal pad, corticosteroid injection. Surgical excision if conservative fails."},

  // ── ANKLE SPECIAL TESTS ──
  {cat:"special",region:"ankle",front:"Anterior drawer test (ankle)",back:"Stabilize tibia → translate talus anteriorly in 20° PF (ATFL under tension).<br><b>Positive:</b> &gt;3–5 mm translation or soft endpoint = ATFL rupture.<br>Most sensitive test for lateral ankle instability. Compare bilaterally."},
  {cat:"special",region:"ankle",front:"Ottawa ankle / foot rules",back:"<b>X-ray ankle if:</b> bone tenderness at posterior tip of medial/lateral malleolus (6 cm up), OR inability to WB (4 steps).<br><b>X-ray foot if:</b> bone tenderness at 5th MT base or navicular, OR same WB criteria.<br>96–99% sensitive — high NPV effectively rules out fracture."},
  {cat:"special",region:"ankle",front:"Thompson test",back:"Patient prone → squeeze calf.<br><b>Positive:</b> no plantar flexion = Achilles rupture.<br>Active PF may still be present (other PF muscles intact) — do not rely on active PF to rule out rupture.<br>Thompson = gold standard clinical test."},
  {cat:"special",region:"ankle",front:"Squeeze test (syndesmosis)",back:"Compress fibula toward tibia at mid-shaft → pain at distal syndesmosis = syndesmotic injury.<br><b>External rotation stress test:</b> foot ER with knee at 90° → distal ankle pain = positive.<br>Both tests together improve accuracy for syndesmosis injury."},

  // ── ANKLE BIOMECHANICS ──
  {cat:"biomech",region:"ankle",front:"Subtalar joint and pronation/supination",back:"Oblique axis (42° from horizontal, 16° from sagittal).<br><b>Pronation:</b> DF + eversion + abduction — unlocks midfoot (shock absorption).<br><b>Supination:</b> PF + inversion + adduction — locks midfoot (propulsion).<br>Excessive pronation: ↑ medial stress → tibial stress fx, PTTD, plantar fasciitis."},
  {cat:"biomech",region:"ankle",front:"Gait — ankle and foot kinematics",back:"<b>IC:</b> heel strike, subtalar neutral. <b>Loading:</b> pronation (shock absorption). <b>Midstance:</b> re-supination begins. <b>Terminal stance:</b> heel rise, supination (rigid lever). <b>Pre-swing:</b> PF peak.<br>DF needed for normal gait: ≥10°. Limited DF → compensatory pronation or early heel rise."},

  // ── ANKLE POST-OP ──
  {cat:"postop",region:"ankle",front:"Achilles tendon repair — protocol",back:"<b>0–2 wk:</b> NWB, splint in PF.<br><b>2–6 wk:</b> progressive WB in boot, ROM begins.<br><b>6–12 wk:</b> wean boot, progressive strengthening.<br><b>3–6 mo:</b> sport-specific, single-leg heel raise.<br>Return to running: 4–6 months. Return to sport: 6–12 months."},
  {cat:"postop",region:"ankle",front:"Lateral ankle stabilization (Broström)",back:"<b>0–2 wk:</b> NWB in splint/boot.<br><b>2–6 wk:</b> progressive WB, ROM.<br><b>6–12 wk:</b> strengthening, proprioception, jogging.<br><b>3–4 mo:</b> sport-specific. Return to sport: 3–4 months.<br>Focus: peroneal strengthening, proprioception, agility."},

  // ── SPINE PATHOLOGY ──
  {cat:"pathology",region:"spine",front:"Lumbar disc herniation",back:"L4–L5 and L5–S1 most common. Posterolateral herniation → nerve root compression.<br><b>Positive:</b> SLR &lt;70° (L4–S1). Crossed SLR = highly specific.<br><b>Centralization</b> (pain moves from leg to back) = good prognostic sign.<br><b>Tx:</b> directional preference (McKenzie), neural mobilization, progressive loading. 90% resolve &lt;12 weeks."},
  {cat:"pathology",region:"spine",front:"Lumbar stenosis",back:"<b>Neurogenic claudication:</b> bilateral leg pain/weakness/paresthesias with walking, relieved by sitting or lumbar flexion.<br><b>Positive bicycle test:</b> flexed posture tolerates exercise (vs. vascular claudication — pulses present, not relieved by flexion).<br><b>Tx:</b> flexion-biased exercises, aquatic therapy. Surgical if severe."},
  {cat:"pathology",region:"spine",front:"Spondylolisthesis",back:"Forward slip of vertebra on one below — L4–L5 or L5–S1 most common.<br><b>Grades:</b> I (0–25%) | II (25–50%) | III (50–75%) | IV (75–100%).<br><b>Isthmic</b> (pars defect, young athletes): bilateral pars stress fracture.<br><b>Tx:</b> stabilization exercise. Grade III–IV or neuro deficit: surgical."},
  {cat:"pathology",region:"spine",front:"Cervical radiculopathy",back:"<b>C5:</b> deltoid weakness, ↓ biceps reflex, lateral arm numbness.<br><b>C6:</b> wrist extensor weakness, ↓ biceps/BR reflex, thumb/index numbness.<br><b>C7:</b> triceps weakness, ↓ triceps reflex, middle finger numbness.<br><b>C8:</b> hand intrinsic weakness, ring/small numbness.<br>Positive Spurling's, ULTT. Shoulder abduction relief sign = disc herniation."},
  {cat:"pathology",region:"spine",front:"Cervical myelopathy",back:"Spinal cord compression → UMN signs below lesion.<br><b>Signs:</b> gait disturbance, hand clumsiness, Hoffman's, hyperreflexia, Babinski, bowel/bladder dysfunction. Lhermitte's sign (electric shock with neck flexion).<br><b>PT:</b> urgent referral. Avoid high-velocity cervical manipulation. Surgical decompression needed."},
  {cat:"pathology",region:"spine",front:"Sacroiliac joint dysfunction",back:"Pain clustered around PSIS (Fortin finger test).<br><b>Cluster (≥3 positive):</b> distraction, compression, thigh thrust, FABER, Gaenslen's = high sensitivity/specificity for SIJ. No single test diagnostic.<br><b>Tx:</b> SIJ stabilization (glute med, multifidus), manipulation/mobilization, SIJ belt."},
  {cat:"pathology",region:"spine",front:"Cauda equina syndrome — red flags",back:"<b>Signs:</b> bilateral leg weakness/numbness, saddle anesthesia (perineum, inner thighs), bowel/bladder dysfunction (retention most common).<br><b>Emergency:</b> decompress within 24–48 hours.<br>Any of these signs = immediate ED referral. Do not treat conservatively."},

  // ── SPINE SPECIAL TESTS ──
  {cat:"special",region:"spine",front:"Straight leg raise (SLR)",back:"Supine → passively raise leg, knee extended.<br><b>Positive:</b> radicular symptoms (not just hamstring tightness) at &lt;70° = lumbar disc herniation / nerve root tension (L4–S1).<br><b>Crossed SLR</b> (opposite leg raises → ipsilateral symptoms): highly specific for large disc herniation."},
  {cat:"special",region:"spine",front:"Spurling's test",back:"Cervical lateral flexion to symptomatic side + slight extension + axial compression.<br><b>Positive:</b> ipsilateral arm symptom reproduction = cervical radiculopathy.<br><b>Sensitivity ~30–60%, specificity ~90–100%.</b> Negative doesn't rule out; positive strongly suggests."},
  {cat:"special",region:"spine",front:"Upper limb tension test (ULTT)",back:"<b>ULTT1 (median nerve bias):</b> shoulder depression + abduction + ER → elbow extension → wrist/finger extension → cervical lateral flexion away.<br><b>Positive:</b> symptom reproduction, sensitized by contralateral neck flexion, relieved by ipsilateral flexion.<br>Tests neural mechanosensitivity — not just compression."},
  {cat:"special",region:"spine",front:"Hoffman's sign",back:"Flick middle finger DIP into extension.<br><b>Positive:</b> involuntary thumb/index flexion = UMN lesion (cervical myelopathy). Analogous to Babinski in UE.<br>Present in ~3% of normals. More significant when bilateral + hyperreflexia + other UMN signs."},
  {cat:"special",region:"spine",front:"Slump test",back:"Seated: thoracic + lumbar flexion + cervical flexion + knee extension + ankle DF.<br><b>Positive:</b> leg symptoms reproduced, relieved by cervical extension = neural mechanosensitivity / dural tension.<br>More sensitive than SLR for L3–L4 and disc herniation in general."},
  {cat:"special",region:"spine",front:"SI joint provocation cluster",back:"<b>Distraction:</b> ASIS press down + lateral. <b>Compression:</b> iliac crest press medially. <b>Thigh thrust:</b> 90° hip flexion + axial load. <b>Gaenslen's:</b> one hip extension, one full flexion. <b>FABER.</b><br>≥3 positive = high likelihood SIJ pain. All negative = rules out SIJ."},

  // ── SPINE BIOMECHANICS ──
  {cat:"biomech",region:"spine",front:"Lumbar spine — disc mechanics",back:"Nucleus pulposus acts as hydraulic ball bearing.<br><b>Flexion:</b> anterior compression, posterior distraction. <b>Extension:</b> posterior compression, anterior opening.<br>Disc herniation most common with flexion + rotation under load.<br>Facet loading greatest in extension."},
  {cat:"biomech",region:"spine",front:"Cervical spine — coupled motion",back:"<b>C2–C7:</b> lateral flexion coupled with ipsilateral rotation.<br><b>C0–C1:</b> flexion/extension, minimal rotation.<br><b>C1–C2:</b> 50% of total cervical rotation occurs here (45° each side).<br>Restriction of coupled motion = facet joint dysfunction."},
  {cat:"biomech",region:"spine",front:"Core stability — clinical model",back:"<b>Local stabilizers</b> (deep): multifidus, TrA, pelvic floor, diaphragm — tonic, anticipatory, segmental control.<br><b>Global stabilizers</b> (superficial): rectus abdominis, erector spinae, obliques — phasic, load transfer.<br>LBP pattern: delayed TrA activation. Rehab: local system first, then integration."},
  {cat:"biomech",region:"spine",front:"Disc herniation types",back:"<b>Protrusion:</b> nucleus within outer annulus.<br><b>Extrusion:</b> nucleus breaches annulus (contained by PLL).<br><b>Sequestration:</b> nucleus fully separated (free fragment).<br><b>Posterolateral</b> (most common): unilateral nerve root compression. <b>Central:</b> bilateral or cauda equina. <b>Foraminal:</b> severe unilateral radiculopathy."},

  // ── SPINE POST-OP ──
  {cat:"postop",region:"spine",front:"Lumbar discectomy / microdiscectomy",back:"<b>Day 1:</b> mobilize, walking encouraged.<br><b>0–6 wk:</b> avoid flexion &gt;90°, lifting &gt;5–10 lbs, gentle extension exercises, postural education.<br><b>6–12 wk:</b> progressive strengthening.<br>Return to work: sedentary 2–6 weeks, manual 3–4 months. Return to sport: 3–6 months. 90% good outcomes."},
  {cat:"postop",region:"spine",front:"Lumbar spinal fusion",back:"Solid fusion takes 6–12 months.<br><b>Phase I (0–6 wk):</b> log roll, no BLT (bending/lifting/twisting), gentle walking, brace if prescribed.<br><b>Phase II (6–12 wk):</b> progressive ambulation, light ADLs.<br><b>Phase III (3–6 mo):</b> core stabilization, progressive strengthening.<br>Monitor adjacent segment mechanics."},
];

// Firebase loaded via CDN
let _db=null;
let _fbRef=null;
let _pendingSave=null;
let _saveTimer=null;
function setSyncStatus(state,msg){
  const dot=document.getElementById('syncDot');
  const txt=document.getElementById('syncTxt');
  if(!dot||!txt)return;
  dot.className='sync-dot'+(state?' '+state:'');
  txt.textContent=msg;
}

function saveState(stateObj){
  // Always save to localStorage as offline fallback
  try{localStorage.setItem('msk_cards_v2',JSON.stringify(stateObj));}catch(e){}
  // Debounce Firebase writes (300ms)
  if(_saveTimer)clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{
    if(!_fbRef){return;}
    setSyncStatus('pending','Saving...');
    _fbRef.set(stateObj)
      .then(()=>setSyncStatus('ok','Synced'))
      .catch(e=>{setSyncStatus('err','Sync failed');console.warn('Firebase save error:',e);});
  },300);
}

function loadState(storageKey,callback){
  // Load from localStorage immediately for fast render
  let localState=null;
  try{const r=localStorage.getItem(storageKey);if(r)localState=JSON.parse(r);}catch(e){}
  callback(localState);

  // Then fetch from Firebase — only call callback again if idx differs
  function tryFirebase(){
    if(typeof firebase==='undefined'){setTimeout(tryFirebase,100);return;}
    try{
      if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
      _db=firebase.database();
      _fbRef=_db.ref('users/'+USER_ID+'/'+storageKey);
      setSyncStatus('pending','Connecting...');
      _fbRef.once('value').then(snap=>{
        const fbState=snap.val();
        if(fbState){
          try{localStorage.setItem(storageKey,JSON.stringify(fbState));}catch(e){}
          setSyncStatus('ok','Synced');
          // Only re-init if Firebase has a different (newer) idx than local
          const localIdx=localState?localState.idx:null;
          if(fbState.idx!==localIdx){callback(fbState);}
          else{
            // Still apply confidence/removedIds from Firebase but don't re-render deck position
            if(typeof activeCats!=='undefined'){
              confidence=fbState.confidence||{};
              removedIds=new Set(fbState.removedIds||[]);
              buildFilters();render();
            }
          }
        } else {
          setSyncStatus('ok','Synced');
        }
      }).catch(e=>{
        setSyncStatus('err','Offline — using local data');
        console.warn('Firebase load error:',e);
      });
    }catch(e){setSyncStatus('err','Firebase error');console.warn(e);}
  }
  tryFirebase();
}

let _initDone=false;
let activeCats,activeRegions,activeConf,deck=[],removedIds=new Set(),confidence={},idx=0,revealed=false;
const WEIGHTS={gotit:1,almost:2,nope:4,unrated:3};
const autoAdvance=true;
let autoTimer=null;
let _history=[];
let sessionStart={};
let sessionReviewed=new Set();

let _firstLoad=true;

function allRated(){return deck.length>0&&deck.every(c=>confKey(c)!=='unrated');}

function weightedNext(){
  const pool=[];
  deck.forEach((c,i)=>{
    if(i===idx)return;
    const w=WEIGHTS[confKey(c)]||1;
    for(let j=0;j<w;j++)pool.push(i);
  });
  if(!pool.length)return(idx+1)%deck.length;
  return pool[Math.floor(Math.random()*pool.length)];
}

function setMode(mode,preserveIdx){
  document.querySelectorAll('.mbtn').forEach(b=>b.classList.remove('active'));
  const mb=document.getElementById('mode-'+mode);if(mb)mb.classList.add('active');
  if(mode==='all'){activeConf=new Set(Object.keys(CONF_FILTER_OPTIONS));}
  else if(mode==='weak'){activeConf=new Set(['nope','almost']);}
  else if(mode==='unseen'){activeConf=new Set(['unrated']);}
  if(!preserveIdx){_history=[];revealed=false;}
  buildFilters();rebuildDeck(preserveIdx);saveState(getState());
}

function cancelAuto(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}}
function scheduleAutoAdvance(){
  if(autoTimer)clearTimeout(autoTimer);
  autoTimer=setTimeout(()=>{advanceCard();},0);
}

function advanceCard(){
  cancelAuto();
  if(deck.length===0)return;
  _history.push(idx);
  if(_history.length>50)_history.shift();
  if(allRated()){idx=weightedNext();}
  else{idx=(idx+1)%deck.length;}
  revealed=false;saveState(getState());render();
}

function showToast(msg,duration=2500){
  const t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;t.style.display='block';t.style.opacity='1';
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>{t.style.display='none';},300);},duration);
}

function finishStudying(e){
  e.preventDefault();
  const reviewed=sessionReviewed.size;
  if(reviewed===0){window.location.href='index.html';return;}
  let moved=[];
  sessionReviewed.forEach(id=>{
    const before=sessionStart[id]||'unrated';
    const after=confidence[id]||'unrated';
    if(before!==after)moved.push({before,after});
  });
  const upgrades=moved.filter(m=>
    (m.before==='unrated'&&m.after!=='unrated')||
    (m.before==='nope'&&(m.after==='almost'||m.after==='gotit'))||
    (m.before==='almost'&&m.after==='gotit')
  ).length;
  const downgrades=moved.filter(m=>
    (m.before==='gotit'&&(m.after==='almost'||m.after==='nope'))||
    (m.before==='almost'&&m.after==='nope')
  ).length;
  const gotit=deck.filter(c=>confidence[cid(c)]==='gotit').length;
  const almost=deck.filter(c=>confidence[cid(c)]==='almost').length;
  const nope=deck.filter(c=>confidence[cid(c)]==='nope').length;
  const unrated=deck.filter(c=>confKey(c)==='unrated').length;
  const srActive=allRated();
  let html=`<div style="margin-bottom:10px;"><strong style="color:var(--text-primary);">Cards reviewed:</strong> ${reviewed}</div>`;
  if(upgrades>0)html+=`<div style="color:#0F6E56;">↑ ${upgrades} card${upgrades>1?'s':''} improved</div>`;
  if(downgrades>0)html+=`<div style="color:#A32D2D;">↓ ${downgrades} card${downgrades>1?'s':''} moved down</div>`;
  html+=`<div style="margin-top:12px;padding-top:12px;border-top:0.5px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;">`;
  if(gotit>0)html+=`<span style="color:#0F6E56;">Got it: ${gotit}</span>`;
  if(almost>0)html+=`<span style="color:#854F0B;">Almost: ${almost}</span>`;
  if(nope>0)html+=`<span style="color:#A32D2D;">Nope: ${nope}</span>`;
  if(unrated>0)html+=`<span style="color:#6b6966;">Unrated: ${unrated}</span>`;
  html+=`</div>`;
  if(srActive)html+=`<div style="margin-top:10px;font-size:12px;color:var(--purple);">Spaced repetition active — all cards rated.</div>`;
  document.getElementById('summaryBody').innerHTML=html;
  document.getElementById('summaryModal').style.display='flex';
}

function closeSummary(){document.getElementById('summaryModal').style.display='none';}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(document.getElementById('summaryModal').style.display==='flex')return;
  switch(e.key){
    case ' ':case 'Spacebar':e.preventDefault();if(deck.length>0)toggle();break;
    case 'ArrowRight':e.preventDefault();go(1);break;
    case 'ArrowLeft':e.preventDefault();go(-1);break;
    case '1':if(revealed)rate('nope');break;
    case '2':if(revealed)rate('almost');break;
    case '3':if(revealed)rate('gotit');break;
  }
});


function initDeck(saved){
  activeCats=new Set(saved?saved.activeCats:Object.keys(CATS));
  activeRegions=new Set(saved?saved.activeRegions:Object.keys(REGIONS));
  activeConf=new Set(saved?saved.activeConf:Object.keys(CONF_FILTER_OPTIONS));
  removedIds=new Set(saved&&saved.removedIds?saved.removedIds:[]);
  confidence=saved&&saved.confidence?saved.confidence:{};
  idx=(saved&&saved.idx!==undefined&&saved.idx!==null)?saved.idx:0;
  if(!_initDone){_initDone=true;
const _mb=document.getElementById('mode-all');if(_mb)_mb.classList.add('active');
buildFilters();rebuildDeck(true);}
  else{buildFilters();rebuildDeck(true);}
}

loadState('msk_cards_v2',initDeck);

function confKey(c){
  const v=confidence[cid(c)];
  return v || 'unrated';
}

function filteredCards(){
  return CARDS.filter(c=>
    !removedIds.has(cid(c)) &&
    activeCats.has(c.cat) &&
    activeRegions.has(c.region) &&
    activeConf.has(confKey(c))
  );
}

function rebuildDeck(preserveIdx){
  deck=filteredCards();
  if(preserveIdx){if(idx>=deck.length)idx=Math.max(0,deck.length-1);}
  else{idx=0;}
  revealed=false;render();
}


function getState(){
  return {
    confidence,
    removedIds:[...removedIds],
    activeCats:typeof activeCats!=='undefined'?[...activeCats]:[],
    activeRegions:typeof activeRegions!=='undefined'?[...activeRegions]:[],
    activeSystems:typeof activeSystems!=='undefined'?[...activeSystems]:[],
    activeSubs:typeof activeSubs!=='undefined'?[...activeSubs]:[],
    activeConf:typeof activeConf!=='undefined'?[...activeConf]:[],
    idx
  };
}

function buildFilters(){
  // category filters
  const catEl=document.getElementById('catFilters');
  catEl.innerHTML='';
  Object.entries(CATS).forEach(([k,v])=>{
    const b=document.createElement('button');
    b.className='fbtn'+(activeCats.has(k)?' active':'');
    if(activeCats.has(k)) b.style.background=v.dot;
    b.textContent=v.label;
    b.onclick=()=>{
      if(activeCats.has(k)) activeCats.delete(k);
      else activeCats.add(k);
      buildFilters();rebuildDeck();saveState(getState());
    };
    catEl.appendChild(b);
  });
  // region filters
  const regEl=document.getElementById('regionFilters');
  regEl.innerHTML='';
  Object.entries(REGIONS).forEach(([k,v])=>{
    const b=document.createElement('button');
    b.className='fbtn'+(activeRegions.has(k)?' active':'');
    if(activeRegions.has(k)) b.style.background=REGION_COLORS[k];
    b.textContent=v;
    b.onclick=()=>{
      if(activeRegions.has(k)) activeRegions.delete(k);
      else activeRegions.add(k);
      buildFilters();rebuildDeck();saveState(getState());
    };
    regEl.appendChild(b);
  });
  // confidence filters
  const confEl=document.getElementById('confFilters');
  confEl.innerHTML='';
  Object.entries(CONF_FILTER_OPTIONS).forEach(([k,v])=>{
    const count=CARDS.filter(c=>!removedIds.has(cid(c))&&activeCats.has(c.cat)&&activeRegions.has(c.region)&&confKey(c)===k).length;
    const b=document.createElement('button');
    const isActive=activeConf.has(k);
    b.className='fbtn'+(isActive?' active':'');
    if(isActive) b.style.cssText='background:'+v.bg+';color:'+v.color+';border-color:'+v.border+';';
    b.textContent=v.label+' ('+count+')';
    b.onclick=()=>{
      if(activeConf.has(k)) activeConf.delete(k);
      else activeConf.add(k);
      buildFilters();rebuildDeck();saveState(getState());
    };
    confEl.appendChild(b);
  });
}

function selectAll(){
  activeCats=new Set(Object.keys(CATS));
  activeRegions=new Set(Object.keys(REGIONS));
  activeConf=new Set(Object.keys(CONF_FILTER_OPTIONS));
  buildFilters();rebuildDeck();saveState(getState());
}
function clearAll(){
  activeCats.clear();activeRegions.clear();activeConf.clear();
  buildFilters();rebuildDeck();saveState(getState());
}

function updateProgressBar(){
  const ALL=CARDS;
  const total=ALL.length;
  const gotit=ALL.filter(c=>confidence[cid(c)]==='gotit'||removedIds.has(cid(c))).length;
  const almost=ALL.filter(c=>!removedIds.has(cid(c))&&confidence[cid(c)]==='almost').length;
  const nope=ALL.filter(c=>!removedIds.has(cid(c))&&confidence[cid(c)]==='nope').length;
  const gp=Math.round(gotit/total*100);
  const ap=Math.round(almost/total*100);
  const np=Math.round(nope/total*100);
  const up=Math.max(0,100-gp-ap-np);
  const bar=document.getElementById('progBar');
  if(bar)bar.innerHTML=
    (gp>0?`<div class="prog-seg" style="background:#5DCAA5;width:${gp}%;"></div>`:'')+
    (ap>0?`<div class="prog-seg" style="background:#EF9F27;width:${ap}%;"></div>`:'')+
    (np>0?`<div class="prog-seg" style="background:#F09595;width:${np}%;"></div>`:'')+
    (up>0?`<div class="prog-seg" style="background:var(--bg-tertiary);width:${up}%;"></div>`:'');
  const txt=document.getElementById('progTxt');
  if(txt)txt.textContent=(idx+1)+' / '+deck.length;
}
function render(){
  updateStats();
  updateProgressBar();
  const area=document.getElementById('cardArea');
  const navRow=document.getElementById('navRow');
  if(deck.length===0){
    let msg;
    if(activeCats.size===0||activeRegions.size===0||activeConf.size===0){
      msg='No filters selected — select at least one option in each row above.';
    } else {
      const allRemoved=CARDS.filter(c=>activeCats.has(c.cat)&&activeRegions.has(c.region)).every(c=>removedIds.has(cid(c)));
      msg=allRemoved
        ? 'All cards mastered! Hit "Reset deck" to bring them back.'
        : 'No cards match the current confidence filter. Adjust the Confidence filter above or hit "Reset deck".';
    }
    area.innerHTML='<div class="empty-state"><strong>'+msg+'</strong></div>';
    navRow.style.display='none';
    
    
    return;
  }
  navRow.style.display='flex';
  if(idx>=deck.length)idx=Math.max(0,deck.length-1);
  const c=deck[idx];
  const id=cid(c);
  sessionReviewed.add(id);
  if(!(id in sessionStart))sessionStart[id]=confidence[id]||'unrated';
  const conf=confidence[id]||null;
  const pct=Math.round(((idx+1)/deck.length)*100);
  
  
  const cat=CATS[c.cat];
  const canRemove=conf==='gotit';

  if(!revealed){
    const confBadge=conf?'<span class="conf-badge" style="background:'+CONF_COLORS[conf].bg+';color:'+CONF_COLORS[conf].color+';">'+CONF_LABELS[conf]+'</span>':'';
    area.innerHTML=`<div class="card card-front" onclick="toggle()">
      <div class="front-cat" style="color:${cat.dot};">${cat.label}</div>
      <div class="front-region" style="color:${REGION_COLORS[c.region]};">${REGIONS[c.region]}</div>
      <div class="front-title">${c.front}</div>
      ${confBadge}
      <div class="hint">Tap to reveal</div>
    </div>`;
  } else {
    const removeBtn=canRemove?'<button class="remove-btn" onclick="removeCard()">Remove</button>':'';
    area.innerHTML=`<div class="card card-back" style="background:${cat.bg};border:0.5px solid ${cat.border};" onclick="handleBackClick(event)">
      <div class="back-title" style="color:${cat.text};">${c.front}</div>
      <div class="badge-row">
        <span class="type-badge" style="background:${cat.badge_bg};color:${cat.badge_color};">${cat.label}</span>
        <span class="region-badge">${REGIONS[c.region]}</span>
      </div>
      <div class="divider" style="background:${cat.border};"></div>
      <div class="blbl" style="color:${cat.dot};">Key facts</div>
      <div class="bval" style="color:${cat.text};">${c.back}</div>
      <div class="spacer"></div>
      <div class="confidence-row" style="border-top:0.5px solid ${cat.border};" onclick="event.stopPropagation()">
        <span class="conf-lbl" style="color:${cat.dot};">Confidence:</span>
        <button class="cbtn cbtn-nope${conf==='nope'?' selected':''}" onclick="rate('nope')">Nope</button>
        <button class="cbtn cbtn-almost${conf==='almost'?' selected':''}" onclick="rate('almost')">Almost</button>
        <button class="cbtn cbtn-gotit${conf==='gotit'?' selected':''}" onclick="rate('gotit')">Got it</button>
        ${removeBtn}
      </div>
      <div class="flip-hint" style="color:${cat.dot};">Tap card to flip back</div>
    </div>`;
  }
}

function handleBackClick(e){if(!e.target.closest('.confidence-row'))toggle();}
function toggle(){revealed=!revealed;render();}

function rate(val){
  cancelAuto();
  const _wasUnrated=!confidence[cid(deck[idx])]||confidence[cid(deck[idx])]==='unrated';
  confidence[cid(deck[idx])]=val;
  if(_wasUnrated&&allRated()){showToast('All cards rated — spaced repetition now active!',3000);}
  if(!activeConf.has(val)){
    deck=filteredCards();
    if(idx>=deck.length)idx=Math.max(0,deck.length-1);
    revealed=false;saveState(getState());buildFilters();render();return;
  }
  saveState(getState());buildFilters();
  if(!revealed){revealed=true;render();scheduleAutoAdvance();}
  else{render();scheduleAutoAdvance();}
}
function removeCard(){
  const id=cid(deck[idx]);
  removedIds.add(id);
  deck=filteredCards();
  if(idx>=deck.length)idx=Math.max(0,deck.length-1);
  revealed=false;saveState(getState());buildFilters();render();
}
function resetDeck(){cancelAuto();_history=[];sessionStart={};sessionReviewed=new Set();document.querySelectorAll('.mbtn').forEach(b=>b.classList.remove('active'));const _ma=document.getElementById('mode-all');if(_ma)_ma.classList.add('active');
  removedIds.clear();
  confidence={};
  activeCats=new Set(Object.keys(CATS));
  activeRegions=new Set(Object.keys(REGIONS));
  activeConf=new Set(Object.keys(CONF_FILTER_OPTIONS));
  idx=0;revealed=false;saveState(getState());buildFilters();rebuildDeck();
}
function updateStats(){
  const total=deck.length;
  const removed=CARDS.filter(c=>removedIds.has(cid(c))).length;
  const gotit=deck.filter(c=>confidence[cid(c)]==='gotit').length;
  const almost=deck.filter(c=>confidence[cid(c)]==='almost').length;
  const nope=deck.filter(c=>confidence[cid(c)]==='nope').length;
  document.getElementById('statsRow').innerHTML=
    '<div class="stat">Active <span>'+total+'</span></div>'+
    '<div class="stat">Mastered <span>'+removed+'</span></div>'+
    '<div class="stat">Got it <span style="color:#0F6E56;">'+gotit+'</span></div>'+
    '<div class="stat">Almost <span style="color:#854F0B;">'+almost+'</span></div>'+
    '<div class="stat">Nope <span style="color:#A32D2D;">'+nope+'</span></div>';
}
function go(dir){cancelAuto();if(dir===-1&&_history.length>0){idx=_history.pop();revealed=false;saveState(getState());render();return;}if(dir===1){advanceCard();return;}const next=idx+dir;if(next<0||next>=deck.length)return;idx=next;revealed=false;saveState(getState());render();}
function shuffle(){cancelAuto();_history=[];
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  idx=0;revealed=false;saveState(getState());render();
}

// init handled by loadState → initDeck
</script>

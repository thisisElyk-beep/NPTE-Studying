<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPTE Flashcards</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap');

  :root {
    --bg: #F2F0EB;
    --surface: #FFFFFF;
    --border: rgba(0,0,0,0.1);
    --text: #1a1a1a;
    --text-secondary: #6b6966;
    --text-tertiary: #a09d9a;
    --green: #0F6E56;
    --green-bg: #E1F5EE;
    --amber: #854F0B;
    --amber-bg: #FAEEDA;
    --red: #A32D2D;
    --red-bg: #FCEBEB;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1c;
      --surface: #242426;
      --border: rgba(255,255,255,0.08);
      --text: #f2f2f7;
      --text-secondary: #aeaeb2;
      --text-tertiary: #6e6e73;
      --green-bg: #0a2e24;
      --amber-bg: #2a1f0a;
      --red-bg: #2e0f0f;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--text);
    padding: 3rem 1.5rem 5rem;
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  header { margin-bottom: 2.5rem; }

  .eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-tertiary);
    font-weight: 500;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 38px;
    font-weight: 400;
    line-height: 1.1;
    color: var(--text);
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-secondary);
  }

  .summary-row {
    display: flex;
    gap: 8px;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }

  .summary-chip {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 999px;
    font-weight: 500;
  }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-tertiary);
    font-weight: 500;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 0.5px solid var(--border);
  }

  .deck-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 2.5rem;
  }

  .deck-card {
    display: block;
    padding: 14px 16px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .deck-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .deck-card:active { transform: translateY(0); }

  .deck-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .deck-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .deck-name {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .arrow { color: var(--text-tertiary); font-size: 14px; }

  /* progress bar */
  .prog-track {
    height: 5px;
    background: var(--bg);
    border-radius: 3px;
    overflow: hidden;
    display: flex;
    gap: 1px;
    margin-bottom: 7px;
  }

  .prog-seg { height: 100%; border-radius: 2px; transition: width 0.4s ease; }

  .stat-row {
    display: flex;
    gap: 10px;
  }

  .stat-chip {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 999px;
  }

  .chip-loading {
    background: var(--bg);
    color: var(--text-tertiary);
  }

  .forge-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    background: linear-gradient(135deg, #141720, #1A1E28);
    border: 0.5px solid rgba(212,168,67,0.35);
    border-radius: 10px;
    text-decoration: none;
    margin-bottom: 6px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .forge-banner:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(212,168,67,0.12); }
  .forge-banner:active { transform: translateY(0); }
  .forge-title {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 18px;
    color: #D4A843;
    margin-bottom: 3px;
  }
  .forge-sub { font-size: 12px; color: #7A7260; }
  .forge-banner .arrow { color: #D4A843; font-size: 16px; flex-shrink: 0; }

    font-size: 12px;
    color: var(--text-tertiary);
    text-align: center;
    line-height: 1.7;
  }

  .sync-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 1.5rem;
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .sync-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #c8c6c3;
    flex-shrink: 0;
    transition: background 0.3s;
  }

  .sync-dot.ok { background: #5DCAA5; }
  .sync-dot.err { background: #F09595; }
  .sync-dot.pending { background: #EF9F27; }
  .pos-chip{font-size:11px;color:var(--text-tertiary);white-space:nowrap;flex-shrink:0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">NPTE Prep</div>
    <h1>Flashcard<br>Decks</h1>
  </header>

  <div class="sync-bar">
    <div class="sync-dot pending" id="syncDot"></div>
    <span id="syncTxt">Loading progress...</span>
  </div>

  <div class="summary-row" id="summaryRow"></div>

  <div class="section-label">Forge</div>

  <a class="forge-banner" href="npte_forge.html">
    <div class="forge-left">
      <div class="forge-title">Forge</div>
      <div class="forge-sub">XP · Streaks · Boss Battles · Trial of Combat</div>
    </div>
    <span class="arrow">→</span>
  </a>

  <div class="section-label" style="margin-top:1.5rem;">Flashcard decks</div>

  <div class="deck-list" id="deckList"></div>

  <div class="footer">
    Bookmark this page for quick access from any device.
  </div>
</div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
window.onload = function() {
const DECKS = [
  { key: "msk_cards_v2",              name: "Musculoskeletal",                         dot: "#E24B4A", href: "MSK_Cards.html" },
  { key: "neuro_cards_v1",            name: "Neurology",                               dot: "#7F77DD", href: "Neuro_Cards.html" },
  { key: "cardiopulm_cards_v1",       name: "Cardiopulmonary",                         dot: "#D85A30", href: "Cardiopulmonary_Cards.html" },
  { key: "integumentary_cards_v1",    name: "Integumentary",                           dot: "#1D9E75", href: "Integumentary_Cards.html" },
  { key: "pediatric_cards_v1",        name: "Pediatrics",                              dot: "#378ADD", href: "Pediatric_Cards.html" },
  { key: "safety_cards_v1",           name: "Safety, Research & Documentation",        dot: "#BA7517", href: "Safety_Cards.html" },
  { key: "sysinteractions_cards_v1",  name: "System Interactions",                     dot: "#D4537E", href: "System_Interactions_Cards.html" },
  { key: "dermamyo_cards_v1",         name: "Dermatomes, Myotomes & Brachial Plexus", dot: "#993C1D", href: "Dermatomes_Myotomes_Brachial_Plexus_Cards.html" },
  { key: "cranial_nerve_cards_v1",    name: "Cranial Nerves",                          dot: "#534AB7", href: "Cranial_Nerve_Cards.html" },
];

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA6EjnhyYUOt0iRYUaywCoqZ5POaVQmcsk",
  authDomain: "npte-flaschcards.firebaseapp.com",
  databaseURL: "https://npte-flaschcards-default-rtdb.firebaseio.com",
  projectId: "npte-flaschcards",
  storageBucket: "npte-flaschcards.firebasestorage.app",
  messagingSenderId: "429875976159",
  appId: "1:429875976199:web:04fc0eda2e758c606e966a"
};
const USER_ID = "thisisElyk";

function setSyncStatus(state, msg) {
  const dot = document.getElementById("syncDot");
  const txt = document.getElementById("syncTxt");
  dot.className = "sync-dot" + (state ? " " + state : "");
  txt.textContent = msg;
}

// Build deck cards with loading state
const list = document.getElementById("deckList");
DECKS.forEach(d => {
  const el = document.createElement("a");
  el.className = "deck-card";
  el.href = d.href;
  el.id = "deck-" + d.key;
  el.innerHTML = `
    <div class="deck-top">
      <div class="deck-left">
        <div class="dot" style="background:${d.dot};"></div>
        <span class="deck-name">${d.name}</span>
      </div>
      <span class="pos-chip" id="pos-${d.key}"></span>
      <span class="arrow">→</span>
    </div>
    <div class="prog-track" id="prog-${d.key}">
      <div class="prog-seg" style="background:var(--border);width:100%;border-radius:3px;"></div>
    </div>
    <div class="stat-row" id="stats-${d.key}">
      <span class="stat-chip chip-loading">Loading...</span>
    </div>`;
  list.appendChild(el);
});

function renderDeck(d, state) {
  const conf = (state && state.confidence) ? state.confidence : {};
  const removed = new Set((state && state.removedIds) ? state.removedIds : []);
  const savedIdx = (state && state.idx != null) ? state.idx : null;
  let gotit = 0, almost = 0, nope = 0;
  Object.entries(conf).forEach(([k, v]) => {
    if (removed.has(k)) return;
    if (v === "gotit") gotit++;
    else if (v === "almost") almost++;
    else if (v === "nope") nope++;
  });
  const mastered = removed.size;
  const totalGotit = gotit + mastered;
  const rated = totalGotit + almost + nope;
  const progEl = document.getElementById("prog-" + d.key);
  const statsEl = document.getElementById("stats-" + d.key);
  const posEl = document.getElementById("pos-" + d.key);

  // Card position
  if (posEl && savedIdx !== null) posEl.textContent = "Card " + (savedIdx + 1);

  if (rated === 0) {
    progEl.innerHTML = `<div class="prog-seg" style="background:var(--border);width:100%;border-radius:3px;"></div>`;
    statsEl.innerHTML = `<span class="stat-chip chip-loading">Not started</span>`;
    return { gotit: 0, almost: 0, nope: 0 };
  }
  const t = rated;
  const gp = Math.round(totalGotit / t * 100);
  const ap = Math.round(almost / t * 100);
  const np = Math.round(nope / t * 100);
  const up = Math.max(0, 100 - gp - ap - np);
  progEl.innerHTML =
    (gp > 0 ? `<div class="prog-seg" style="background:#5DCAA5;width:${gp}%;"></div>` : "") +
    (ap > 0 ? `<div class="prog-seg" style="background:#EF9F27;width:${ap}%;"></div>` : "") +
    (np > 0 ? `<div class="prog-seg" style="background:#F09595;width:${np}%;"></div>` : "") +
    (up > 0 ? `<div class="prog-seg" style="background:var(--border);width:${up}%;"></div>` : "");
  statsEl.innerHTML =
    (totalGotit > 0 ? `<span class="stat-chip" style="background:var(--green-bg);color:var(--green);">Got it ${totalGotit}</span>` : "") +
    (almost > 0 ? `<span class="stat-chip" style="background:var(--amber-bg);color:var(--amber);">Almost ${almost}</span>` : "") +
    (nope > 0 ? `<span class="stat-chip" style="background:var(--red-bg);color:var(--red);">Nope ${nope}</span>` : "");
  return { gotit: totalGotit, almost, nope };
}

if (typeof firebase === "undefined") {
  setSyncStatus("err", "Firebase failed to load");
  DECKS.forEach(d => {
    const s = document.getElementById("stats-" + d.key);
    if (s) s.innerHTML = `<span class="stat-chip chip-loading">Offline</span>`;
  });
  return;
}

try {
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
} catch(e) {}

const db = firebase.database();
const userRef = db.ref("users/" + USER_ID);

userRef.once("value").then(snap => {
  const data = snap.val() || {};
  let tg = 0, ta = 0, tn = 0;
  DECKS.forEach(d => {
    const r = renderDeck(d, data[d.key]);
    tg += r.gotit; ta += r.almost; tn += r.nope;
  });
  const summaryRow = document.getElementById("summaryRow");
  if (tg + ta + tn > 0) {
    summaryRow.innerHTML =
      (tg > 0 ? `<span class="summary-chip" style="background:var(--green-bg);color:var(--green);">Got it ${tg}</span>` : "") +
      (ta > 0 ? `<span class="summary-chip" style="background:var(--amber-bg);color:var(--amber);">Almost ${ta}</span>` : "") +
      (tn > 0 ? `<span class="summary-chip" style="background:var(--red-bg);color:var(--red);">Nope ${tn}</span>` : "");
  }
  setSyncStatus("ok", "Progress synced");
}).catch(e => {
  setSyncStatus("err", "Couldn't load progress — check connection");
  DECKS.forEach(d => {
    const s = document.getElementById("stats-" + d.key);
    if (s) s.innerHTML = `<span class="stat-chip chip-loading">Offline</span>`;
  });
});
}
</script>
</body>
</html>

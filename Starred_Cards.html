  (function(){
    const _cards = [
  // ── PATIENT SAFETY ──
  {cat:"patient",sub:"falls",front:"Fall risk assessment — key tools",back:"<b>Morse Fall Scale:</b> 6 items — score ≥45 = high risk.<br><b>Berg Balance Scale:</b> 0–56 — score &lt;45 predicts falls in community dwellers.<br><b>TUG:</b> &gt;12 sec = fall risk in community; &gt;30 sec = dependent in transfers.<br><b>30-sec chair stand:</b> &lt;8 reps = fall risk.<br><b>Single leg stance:</b> &lt;5 sec = elevated fall risk."},
  {cat:"patient",sub:"falls",front:"Fall prevention interventions",back:"<b>Most effective (evidence-based):</b> multifactorial programs — exercise, home hazard modification, medication review, vision correction.<br><b>Best single exercise:</b> Tai Chi.<br><b>Hospital:</b> bed alarm, non-slip footwear, call bell in reach, adequate lighting, hourly rounding.<br><b>High-risk:</b> two-person assist, gait belt, fall mat. Post-fall: assess, document, incident report."},
  {cat:"patient",sub:"falls",front:"Orthostatic hypotension",back:"<b>Definition:</b> SBP drop ≥20 mmHg or DBP drop ≥10 mmHg within 3 min of standing.<br><b>Measure:</b> supine → sit (1 min) → stand (1 min, 3 min).<br><b>Symptoms:</b> lightheadedness, dizziness, syncope on standing.<br><b>Management:</b> slow position changes (dangle), compression stockings, adequate hydration, abdominal binder (SCI T6+)."},
  {cat:"patient",sub:"error",front:"Medical error — types and prevention",back:"<b>Never events:</b> wrong-site surgery, falls with major injury, Stage 3/4 pressure injuries acquired in facility.<br><b>Near miss:</b> caught before reaching patient. <b>Adverse event:</b> reaches patient.<br><b>RCA</b> (root cause analysis): systematic review after adverse event.<br><b>Swiss cheese model:</b> errors occur when multiple defense layers align.<br>PT: two-patient identifiers, verify orders, incident reports, SBAR handoffs."},
  {cat:"patient",sub:"error",front:"SBAR communication tool",back:"<b>S</b>ituation: what is happening now?<br><b>B</b>ackground: relevant clinical history.<br><b>A</b>ssessment: what do you think is going on?<br><b>R</b>ecommendation: what do you need/suggest?<br>Use for clinical handoffs, reporting deteriorating patients, escalating concerns to physicians. Most effective structured communication tool — reduces errors at transitions of care."},
  {cat:"patient",sub:"vitals",front:"Vital signs — exercise stop criteria",back:"<b>Stop exercise:</b> SBP &gt;180 or &lt;90, DBP &gt;110, HR &gt;HRmax or &lt;50 (symptomatic), SpO2 &lt;88%, RR &gt;40.<br><b>Call EMS:</b> SBP &gt;200/DBP &gt;110 at rest, chest pain, syncope, SpO2 &lt;85% not responding to O2, stroke signs (FAST), PE signs.<br><b>Withhold exercise:</b> resting HR &gt;100 or &lt;50 (symptomatic), temp &gt;38.5°C."},
  {cat:"patient",sub:"vitals",front:"Blood pressure — classification and PT thresholds",back:"<b>Normal:</b> &lt;120/80 &nbsp; <b>Stage 1:</b> 130–139/80–89 &nbsp; <b>Stage 2:</b> ≥140/90<br><b>Hypertensive urgency:</b> &gt;180/120 without organ damage.<br><b>Hypertensive emergency:</b> &gt;180/120 with organ damage.<br><b>Withhold exercise:</b> resting SBP &gt;180 or DBP &gt;110.<br><b>Hypotensive crisis:</b> SBP &lt;80 → stop, supine, call for help."},
  {cat:"patient",sub:"vitals",front:"Pulse oximetry — limitations",back:"SpO2 measures Hgb saturation — does NOT measure PaO2 directly.<br><b>Inaccurate in:</b> CO poisoning (falsely high), methemoglobinemia, poor perfusion (hypothermia, shock), dark nail polish, severe anemia.<br><b>Probe:</b> finger preferred; earlobe if poor peripheral perfusion.<br>Always correlate with clinical picture — don't rely on SpO2 alone."},

  // ── EMERGENCY RESPONSE ──
  {cat:"emergency",sub:"cpr",front:"Adult CPR — AHA guidelines",back:"Unresponsive, no normal breathing → activate EMS, get AED.<br><b>CAB:</b> Compressions → Airway → Breathing.<br><b>Rate:</b> 100–120/min. <b>Depth:</b> ≥2 inches, allow full recoil.<br><b>Ratio:</b> 30:2 (untrained: compression-only OK).<br><b>AED:</b> attach ASAP, minimize interruptions (&lt;10 sec). High-quality CPR = most important intervention."},
  {cat:"emergency",sub:"cpr",front:"AED use — sequence",back:"1. Power on.<br>2. Attach pads: right upper chest + left apex (below armpit).<br>3. Analyze rhythm — clear and do not touch patient.<br>4. Shock if advised — clear and deliver.<br>5. Resume CPR immediately (compressions first).<br>6. Repeat every 2 minutes.<br><b>Shockable:</b> VF, pulseless VT. <b>Non-shockable:</b> asystole, PEA → continue CPR only."},
  {cat:"emergency",sub:"cpr",front:"Pediatric CPR differences",back:"<b>Infant (&lt;1 yr):</b> 2-finger compressions, depth 1.5 in, 30:2 (2 rescuers: 15:2). Check brachial pulse.<br><b>Child (1 yr–puberty):</b> 1–2 hands, depth 2 in, 30:2.<br><b>Infant obstruction:</b> 5 back blows + 5 chest thrusts (not abdominal).<br><b>AED:</b> pediatric pads for &lt;8 yr or &lt;25 kg — use adult if unavailable."},
  {cat:"emergency",sub:"medical",front:"Choking — foreign body airway obstruction",back:"<b>Mild</b> (can cough): encourage coughing, do not intervene.<br><b>Severe</b> (cannot speak/cough/breathe, cyanotic): Heimlich — fist above navel, below xiphoid, upward thrusts until expelled or unconscious.<br><b>Unconscious:</b> lower to ground, CPR — check airway before each breath.<br><b>Pregnant/obese:</b> chest thrusts instead of abdominal."},
  {cat:"emergency",sub:"medical",front:"Syncope vs cardiac arrest",back:"<b>Syncope:</b> transient LOC from cerebral hypoperfusion — self-limiting, spontaneous recovery. Legs elevated (↑ venous return). Causes: vasovagal, orthostatic, arrhythmia.<br><b>Cardiac arrest:</b> no pulse, no breathing → CPR + AED.<br>If unsure: check pulse ≤10 sec. No pulse = treat as cardiac arrest. Pulse but unconscious = recovery position + monitor + EMS."},
  {cat:"emergency",sub:"medical",front:"Anaphylaxis — recognition and response",back:"<b>Signs:</b> urticaria, angioedema, bronchospasm (wheeze/stridor), hypotension, tachycardia.<br><b>Common triggers in PT:</b> latex, medications.<br><b>Treatment:</b> epinephrine IM (lateral thigh) FIRST → call EMS.<br><b>Position:</b> supine + legs elevated (if hypotensive) or sitting (if respiratory distress).<br>Know EpiPen location in facility."},
  {cat:"emergency",sub:"fire",front:"Fire response — RACE and PASS",back:"<b>RACE:</b> Rescue (remove patients in danger) → Alarm (pull alarm, call 911) → Contain (close doors) → Extinguish/Evacuate.<br><b>PASS</b> (extinguisher): Pull pin → Aim at base → Squeeze → Sweep side to side.<br>Horizontal evacuation first. Vertical (stairwell) only if horizontal not possible. Never use elevators."},
  {cat:"emergency",sub:"fire",front:"Disaster preparedness — START triage",back:"<b>START triage:</b> assess RPM (Respirations, Perfusion, Mental status).<br><b>Immediate (red):</b> life threat, treatable. <b>Delayed (yellow):</b> serious but stable. <b>Minor (green):</b> walking wounded. <b>Expectant (black):</b> unsurvivable or deceased.<br><b>ICS/HICS:</b> standardized disaster command structure — PT may serve as treatment group supervisor."},

  // ── INFECTION CONTROL ──
  {cat:"infection",sub:"ppe",front:"Standard precautions — always",back:"Apply with ALL patients regardless of diagnosis.<br><b>Components:</b> hand hygiene (most important), gloves (blood/body fluids), gown (splash risk), mask/eye protection (face splash), safe needle handling, respiratory etiquette, environmental cleaning.<br><b>Hand hygiene:</b> soap + water for C. diff and visible soil. Alcohol-based rub for everything else.<br><b>5 moments:</b> before patient, before procedure, after fluid exposure, after patient, after patient environment."},
  {cat:"infection",sub:"ppe",front:"PPE — donning and doffing order",back:"<b>Donning:</b> Gown → Mask/respirator → Goggles/face shield → Gloves.<br><b>Doffing</b> (most contaminated first): Gloves → Goggles/face shield → Gown → Mask/respirator.<br>Hand hygiene after each doffing step.<br>Most contaminated = gloves (remove first). Least contaminated = mask (remove last)."},
  {cat:"infection",sub:"isolation",front:"Transmission-based precautions",back:"<b>Contact</b> (MRSA, C. diff, VRE): gloves + gown for all contact. C. diff = soap and water only (alcohol ineffective).<br><b>Droplet</b> (flu, COVID, pertussis): surgical mask within 3–6 feet, private room.<br><b>Airborne</b> (TB, measles, varicella): N95 (fit-tested), negative pressure room, door closed.<br>Varicella = airborne + contact."},
  {cat:"infection",sub:"isolation",front:"MRSA, VRE, C. diff — key distinctions",back:"<b>MRSA:</b> contact precautions. Most common HAI. Skin/wound, pneumonia, bacteremia.<br><b>VRE:</b> contact precautions. GI tract colonization. Immunocompromised risk.<br><b>C. diff:</b> contact precautions. Spore-forming — alcohol ineffective, must use soap + water, hypochlorite (bleach) cleaning, dedicated equipment.<br>All three: private room preferred, dedicated equipment."},
  {cat:"infection",sub:"sterilization",front:"Sterilization vs disinfection vs cleaning",back:"<b>Cleaning:</b> removes visible soil — required first.<br><b>Disinfection:</b> high-level (endoscopes), intermediate-level (semicritical), low-level (stethoscopes, BP cuffs).<br><b>Sterilization:</b> destroys all microorganisms including spores — surgical instruments.<br><b>Spaulding classification:</b> critical = sterile | semicritical = high-level disinfect | noncritical = low-level disinfect."},

  // ── EQUIPMENT SAFETY ──
  {cat:"equipment",sub:"transfers",front:"Transfer safety — lifts and gait belts",back:"<b>Gait belt:</b> over clothing at waist, snug (2 fingers fit), buckle off-center. Required for all ambulation assistance with fall risk.<br><b>Mechanical lift:</b> required for total assist — protects patient and clinician.<br><b>Never lift from axilla</b> — brachial plexus injury risk.<br>No-lift policy in many facilities — always use appropriate equipment."},
  {cat:"equipment",sub:"transfers",front:"Bed mobility and transfer principles",back:"<b>Log roll:</b> maintain spinal alignment — post-spine surgery, spinal precautions.<br><b>Supine → sit:</b> roll to side, lower legs while pushing up.<br><b>Sit → stand:</b> feet flat, hip-width, lean forward ('nose over toes'), push from armrests.<br><b>Sliding board:</b> for patients who cannot bear weight — bridge surfaces, reduce friction.<br>Always lock wheels before transfers."},
  {cat:"equipment",sub:"mobility",front:"Assistive device — gait patterns",back:"<b>NWB/TTWB:</b> 3-point gait (both crutches + affected LE together, then unaffected).<br><b>4-point gait:</b> crutch → opposite foot → other crutch → other foot — most stable, slowest.<br><b>2-point gait:</b> crutch + opposite foot simultaneously — faster.<br><b>Cane:</b> contralateral hand.<br><b>Stairs:</b> 'Up with the good, down with the bad.'"},
  {cat:"equipment",sub:"mobility",front:"Crutch and cane fitting",back:"<b>Axillary crutches:</b> 2–3 finger widths below axilla, elbow 15–30° flexion. Weight through hands — NEVER axilla (radial nerve risk).<br><b>Lofstrand (forearm):</b> cuff at proximal forearm, elbow 15–20° — preferred long-term.<br><b>Cane:</b> greater trochanter height, elbow 20–30°.<br><b>Walker:</b> greater trochanter height, elbows 15–20°. Standard = pick up. Rollator = continuous contact."},
  {cat:"equipment",sub:"modalities",front:"Electrical stimulation — contraindications",back:"<b>Absolute:</b> cardiac demand pacemaker, over carotid sinus, transthoracic, over malignancy, active bleeding, DVT/thrombophlebitis.<br><b>Relative:</b> pregnancy (over abdomen/low back), open wounds, impaired sensation, impaired cognition.<br>Always perform sensation test before application."},
  {cat:"equipment",sub:"modalities",front:"Ultrasound — contraindications",back:"<b>Absolute:</b> malignancy, active infection, DVT/thrombophlebitis, epiphyseal plates (thermal), pacemaker, gonads, pregnant uterus, eyes, skull/spine with laminectomy.<br><b>Relative:</b> acute inflammation (thermal), impaired sensation.<br><b>Metal implants:</b> NOT contraindicated — conducts heat safely.<br>Ensure adequate coupling medium."},
  {cat:"equipment",sub:"modalities",front:"Thermal modalities — contraindications",back:"<b>Heat contraindicated:</b> impaired circulation/sensation, malignancy, acute inflammation, bleeding, DVT, open wounds, pregnancy (over abdomen).<br><b>Cold contraindicated:</b> Raynaud's, cold hypersensitivity (urticaria), over regenerating peripheral nerves, impaired sensation, poor circulation.<br><b>Both:</b> impaired sensation — patient cannot report adverse response. Test sensation first."},

  // ── DOCUMENTATION & LEGAL ──
  {cat:"legal",sub:"consent",front:"Informed consent",back:"<b>Components:</b> disclosure (risks, benefits, alternatives, right to refuse), comprehension, voluntariness (no coercion), competence.<br><b>Implied consent:</b> emergency — patient cannot consent, reasonable person would.<br><b>Minors:</b> assent from child, consent from parent/guardian.<br>Written consent: required for invasive procedures. Document all discussions."},
  {cat:"legal",sub:"consent",front:"Patient rights and advance directives",back:"<b>Rights include:</b> information, participate in decisions, refuse treatment, privacy/confidentiality, access records, file grievances.<br><b>Living will:</b> specifies wishes. <b>POLST:</b> actionable physician orders. <b>DNR:</b> must be physician-signed, must be in chart.<br>Know patient's code status before initiating treatment. Honor advance directives."},
  {cat:"legal",sub:"hipaa",front:"HIPAA — key provisions for PT",back:"<b>PHI:</b> any individually identifiable health info (name, DOB, diagnosis, billing).<br><b>Minimum necessary standard:</b> share only what's needed.<br><b>Permitted without authorization:</b> treatment, payment, operations, public health, law enforcement, court orders.<br><b>PT must:</b> never discuss PHI in public, secure EMR, log out, shred documents."},
  {cat:"legal",sub:"scope",front:"Scope of practice — PT and PTA",back:"<b>PT:</b> evaluate, diagnose, plan of care, supervise PTA and support staff.<br><b>PTA:</b> implements plan of care — cannot evaluate, establish/modify POC independently, or perform selective sharp debridement (state-dependent).<br><b>Supervision levels:</b> general (PT by phone), direct (PT on premises), direct personal (PT in room).<br>PT responsible for all clinical decisions."},
  {cat:"legal",sub:"scope",front:"Mandatory reporting obligations",back:"<b>All states:</b> child abuse/neglect — report reasonable suspicion (no proof needed).<br><b>Most states:</b> elder/dependent adult abuse.<br><b>Duty to warn (Tarasoff):</b> patient threatens identifiable third party → may override confidentiality.<br><b>Infectious disease:</b> certain diagnoses reportable to public health (TB, STIs).<br>Document all reports: time, person contacted, info provided."},
  {cat:"legal",sub:"documentation",front:"Documentation — SOAP and legal standards",back:"<b>SOAP:</b> Subjective (patient report) → Objective (measurable findings) → Assessment (clinical interpretation) → Plan.<br><b>Legal standards:</b> accurate, timely, complete, legible, no blank spaces, no erasures (single line through error, initial, date), signed with credentials.<br><b>Late entry:</b> label clearly. <b>EMR:</b> never delete — audit trail maintained.<br>'If it wasn't documented, it wasn't done.'"},
  {cat:"legal",sub:"documentation",front:"Goal writing — SMART goals",back:"<b>S</b>pecific: what will the patient do?<br><b>M</b>easurable: how will you know? (metric, distance, scale score)<br><b>A</b>ttainable: realistic given status and prognosis.<br><b>R</b>elevant: functional, tied to meaningful activity.<br><b>T</b>ime-bound: by when?<br><b>Example:</b> 'Patient will ambulate 150 ft on level surfaces with SPC, modified independent, within 4 weeks.'"},

  // ── RESEARCH & EBP ──
  {cat:"research",sub:"study",front:"Levels of evidence — hierarchy",back:"<b>Level I:</b> systematic reviews/meta-analyses of RCTs.<br><b>Level II:</b> individual RCTs.<br><b>Level III:</b> non-randomized controlled trials, cohort studies.<br><b>Level IV:</b> case-control studies, case series.<br><b>Level V:</b> expert opinion, case reports.<br>CPGs synthesize across levels — follow when available."},
  {cat:"research",sub:"study",front:"RCT — key concepts",back:"<b>Randomization:</b> eliminates selection bias.<br><b>Blinding:</b> single (patient), double (patient + researcher), triple (+ statistician).<br><b>ITT (intention-to-treat):</b> analyze all assigned — most conservative, reduces bias.<br><b>Per-protocol:</b> compliant only — overestimates effect.<br>Randomization distributes confounders equally between groups."},
  {cat:"research",sub:"study",front:"Reliability and validity",back:"<b>Reliability:</b> intra-rater (same rater, different time), inter-rater (different raters, same time), test-retest.<br><b>Validity:</b> content (covers domain), construct (measures concept), criterion (correlates with gold standard).<br><b>MDC:</b> change exceeding measurement error — confirms true change.<br><b>MCID:</b> smallest change meaningful to patient. MDC must be exceeded first."},
  {cat:"research",sub:"stats",front:"Sensitivity and specificity",back:"<b>Sensitivity</b> (true positive rate): high → few false negatives → rules OUT.<br><b>SnNout:</b> Sensitive test + Negative result = rules Out.<br><b>Specificity</b> (true negative rate): high → few false positives → rules IN.<br><b>SpPin:</b> Specific test + Positive result = rules In.<br><b>Example:</b> SLR = high sensitivity (rules out disc). Spurling's = high specificity (rules in radiculopathy)."},
  {cat:"research",sub:"stats",front:"Positive and negative predictive value",back:"<b>PPV:</b> probability a positive test truly indicates disease. High prevalence → ↑ PPV.<br><b>NPV:</b> probability a negative test truly indicates absence of disease. High prevalence → ↓ NPV.<br>Unlike sensitivity/specificity, PPV and NPV change with prevalence.<br>Always consider pre-test probability when interpreting results."},
  {cat:"research",sub:"stats",front:"Statistical vs clinical significance",back:"<b>P-value:</b> probability result is due to chance. P &lt;0.05 = statistically significant. Does NOT mean clinically meaningful.<br><b>Effect size (Cohen's d):</b> small 0.2 | medium 0.5 | large 0.8.<br><b>NNT:</b> number needed to treat for one to benefit — lower = better.<br><b>CI:</b> if crosses 0 (difference) or 1.0 (ratio) = not statistically significant."},
  {cat:"research",sub:"stats",front:"Types of error and power",back:"<b>Type I (alpha):</b> false positive — rejecting null when true. Acceptable: α = 0.05.<br><b>Type II (beta):</b> false negative — failing to reject null when false. Acceptable: β = 0.20.<br><b>Power</b> = 1 − β = 0.80 (80% standard).<br>↑ Power: larger sample, larger effect size, lower alpha.<br>NPTE: Type I = saying treatment works when it doesn't. Type II = opposite."},
  {cat:"research",sub:"ebp",front:"Evidence-based practice — three components",back:"EBP integrates:<br><b>1.</b> Best available research evidence.<br><b>2.</b> Clinical expertise and judgment.<br><b>3.</b> Patient values and preferences.<br>All three required — research alone is insufficient.<br><b>PICO:</b> Patient/Population, Intervention, Comparison, Outcome.<br>Follow CPGs when available; document rationale when deviating."},
  {cat:"research",sub:"ebp",front:"Outcome measure selection — key properties",back:"<b>Reliability:</b> ICC ≥0.75 = good | ≥0.90 = excellent.<br><b>Validity:</b> established for target population.<br><b>Responsiveness:</b> detects change over time.<br><b>MDC:</b> confirms true change (exceeds measurement error).<br><b>MCID:</b> confirms clinical relevance.<br><b>Avoid floor/ceiling effects.</b> Use condition-specific measures when available (VISA-A, DASH, KOOS)."},
];
    _cards.forEach((c,i) => {
      c._deck = 'safety_cards_v1';
      c._id = c._id || ('card_' + i);
      c._label = 'Safety';
      c._color = '#BA7517';
      // normalise front/back for CN deck
      if(!c.front && c.name) c.front = 'CN ' + c.num + ' — ' + c.name;
      if(!c.back && c.functions) c.back = '<b>Functions:</b> ' + c.functions + '<br><b>If damaged:</b> ' + c.finding;
    });
    ALL_CARDS.push(..._cards);
  })();

  (function(){
    const _cards = [
  // ── SCREENING & REFERRAL ──
  {cat:"screening",sub:"general",front:"Red flags — immediate referral",back:"<b>Cauda equina:</b> saddle anesthesia + bladder retention = emergency.<br><b>Cardiac:</b> chest pain not reproduced by palpation + diaphoresis + dyspnea = call EMS.<br><b>Stroke:</b> FAST (Face, Arm, Speech, Time to call 911).<br><b>Fracture:</b> trauma + inability to WB + point tenderness.<br><b>Infection:</b> fever + night pain + unexplained weight loss + immunocompromised = urgent referral."},
  {cat:"screening",sub:"general",front:"Cyriax's systemic disease pattern",back:"Constant pain unrelated to movement or position.<br>Pain at rest and at night.<br>Bilateral or alternating symptoms.<br>Multi-joint involvement without trauma.<br>Systemically unwell: fever, weight loss (&gt;10 lbs/6 months), fatigue, night sweats.<br>Progressive worsening despite appropriate PT.<br>Any of these = screen for systemic cause before treating as mechanical."},
  {cat:"screening",sub:"general",front:"SINSS — symptom behavior screening",back:"<b>S</b>everity: pain out of proportion to mechanism?<br><b>I</b>rritability: how easily provoked, how long to settle?<br><b>N</b>ature: mechanical (position-dependent) vs chemical (constant, non-mechanical)?<br><b>S</b>tage: acute, subacute, chronic?<br><b>S</b>pecial questions: weight loss, night pain, bilateral symptoms, bowel/bladder.<br>High irritability + non-mechanical behavior = treat cautiously, consider referral."},
  {cat:"screening",sub:"cardiac",front:"Cardiac red flags in PT",back:"<b>Stop immediately + call EMS:</b> chest pain/pressure during exercise, jaw/left arm pain + diaphoresis, new arrhythmia, SBP drop &gt;10 mmHg with ↑ workload, syncope.<br>Give NTG if prescribed — EMS if no relief in 5 min.<br>Do not leave patient alone."},
  {cat:"screening",sub:"cardiac",front:"Ankle swelling — differential screening",back:"<b>Bilateral pitting:</b> cardiac failure (JVD, orthopnea, S3), hypoalbuminemia, venous insufficiency, medications (CCBs, steroids).<br><b>Unilateral pitting:</b> DVT, Baker's cyst rupture, cellulitis.<br><b>Non-pitting bilateral:</b> lymphedema, lipedema, myxedema (hypothyroid).<br>Bilateral + JVD + dyspnea = cardiac referral."},
  {cat:"screening",sub:"pulmonary",front:"Pulmonary red flags in PT",back:"<b>SpO2 &lt;88%</b> at rest or exercise: withhold, O2, notify MD.<br><b>Hemoptysis:</b> refer — lung cancer, PE, severe infection until ruled out.<br><b>Stridor</b> (high-pitched inspiratory): upper airway obstruction — emergency.<br><b>Sudden dyspnea + pleuritic pain + tachycardia:</b> PE until proven otherwise.<br><b>Asymmetric breath sounds + tracheal deviation:</b> tension pneumothorax — call EMS."},
  {cat:"screening",sub:"neuro",front:"Neurological red flags in PT",back:"<b>Bowel/bladder + saddle anesthesia:</b> cauda equina — emergency.<br><b>Bilateral neuro symptoms from single spinal level:</b> cord compression or systemic cause — urgent referral.<br><b>Progressive neuro deficit:</b> urgent referral.<br><b>Worst headache of life:</b> subarachnoid hemorrhage — call EMS.<br><b>Hoffman's + hyperreflexia + gait disturbance:</b> myelopathy — imaging before mobilization."},
  {cat:"screening",sub:"msk",front:"MSK red flags — fracture and infection",back:"<b>Fracture:</b> mechanism + point tenderness + inability to WB (Ottawa rules).<br><b>Stress fracture:</b> insidious onset, focal bone tenderness, activity-related.<br><b>Osteomyelitis:</b> bone pain + fever + ↑ ESR/CRP — refer.<br><b>Septic arthritis:</b> acute joint swelling + fever + restricted ROM — emergency aspiration needed.<br><b>Tumor:</b> constant bone pain, night pain, unexplained swelling. Age &lt;20 or &gt;50 with new back pain + no trauma = red flag."},
  {cat:"screening",sub:"gi",front:"GI / hepatic referral signs",back:"<b>Referred pain patterns:</b> liver/gallbladder → right shoulder tip (phrenic C3–C5). Spleen → left shoulder (Kehr's sign). Pancreas → mid-back/epigastric. Appendix → RLQ (McBurney's).<br><b>GI red flags:</b> blood in stool, unexplained weight loss, progressive dysphagia, jaundice, abdominal mass.<br>Any abdominal symptom not reproduced by palpation or movement = refer."},
  {cat:"screening",sub:"renal",front:"Renal referral signs",back:"<b>CVA tenderness:</b> kidney infection (pyelonephritis) — posterior flank pain + punch tenderness. Differentiates from lumbar muscle pain (not tender to percussion).<br><b>Hematuria:</b> calculi, infection, malignancy.<br><b>Bilateral edema + HTN + proteinuria:</b> nephrotic syndrome.<br><b>Renal colic:</b> severe flank pain radiating to groin."},

  // ── MEDICATIONS & PT ──
  {cat:"medications",sub:"cardiac",front:"Medications that blunt HR response",back:"<b>Beta-blockers</b> (metoprolol, atenolol, carvedilol): most significant — blunt HR and BP response.<br><b>CCBs</b> (verapamil, diltiazem): reduce HR and BP.<br><b>Digoxin:</b> reduces ventricular rate in AF.<br>Never use 220 − age formula for beta-blocker patients. Use RPE or HR from GXT on medication."},
  {cat:"medications",sub:"cardiac",front:"Medications causing orthostatic hypotension",back:"<b>High-risk drugs:</b> antihypertensives, diuretics, alpha-blockers, TCAs, antipsychotics, nitrates, opioids, Parkinson's meds (levodopa).<br><b>Definition:</b> SBP drop ≥20 mmHg or DBP drop ≥10 mmHg within 3 min of standing.<br><b>PT protocol:</b> measure lying → sitting → standing, wait 1–2 min each. Slow position changes, compression stockings, adequate hydration."},
  {cat:"medications",sub:"msk",front:"Medications affecting bone and tendon",back:"<b>Corticosteroids</b> (long-term): osteoporosis, AVN (femoral head), proximal myopathy, impaired wound healing.<br><b>Fluoroquinolones</b> (ciprofloxacin): tendon rupture risk — Achilles most common. Avoid aggressive eccentric loading during course and 4 weeks after.<br><b>Bisphosphonates:</b> ↓ fracture risk but associated with atypical femoral fractures (long-term) and jaw osteonecrosis."},
  {cat:"medications",sub:"neuro",front:"Medications affecting balance and falls",back:"<b>Highest fall risk:</b> benzodiazepines (most evidence), opioids, TCAs, antipsychotics, anticonvulsants, sedating antihistamines.<br><b>Moderate risk:</b> antihypertensives (orthostatic), diuretics, SSRIs, alpha-blockers.<br><b>Polypharmacy (≥4 meds):</b> independent fall risk factor.<br>PT: identify high-risk meds, screen orthostatic BP, implement fall prevention, communicate with prescriber."},
  {cat:"medications",sub:"general",front:"NSAIDs — PT implications",back:"COX inhibition → ↓ prostaglandins → analgesia, anti-inflammatory, antipyretic.<br><b>PT:</b> may mask pain — do not progress load based on NSAID-reduced pain alone.<br>Impair tendon and bone healing long-term (prostaglandins required for healing cascade).<br><b>Risks:</b> GI (take with food), renal (elderly/dehydrated), fluid retention (avoid in HF).<br>Topical NSAIDs: fewer systemic effects for superficial MSK pain."},
  {cat:"medications",sub:"general",front:"Opioids — PT implications",back:"<b>Effects:</b> analgesia, sedation, constipation, respiratory depression, dependence.<br><b>PT:</b> sedation impairs motor learning — schedule when at therapeutic peak if possible.<br>Constipation may mimic lumbar pain (abdominal guarding).<br>Monitor RR during exercise.<br><b>Opioid-induced hyperalgesia:</b> paradoxical ↑ pain with long-term use — suspect when pain worsens despite dose escalation."},
  {cat:"medications",sub:"general",front:"Anticoagulants — exercise safety",back:"DVT on anticoagulation: ambulation safe and encouraged — do not rest.<br><b>Increased bleeding risk:</b> fall prevention critical. Avoid contact sports.<br><b>Monitor for internal bleeding:</b> abdominal pain, severe headache, visual changes, significant bruising.<br><b>Warfarin:</b> INR &gt;3.5 = exercise with caution, notify MD."},
  {cat:"medications",sub:"diabetes",front:"Diabetes medications — PT implications",back:"<b>Insulin + sulfonylureas:</b> hypoglycemia risk during exercise.<br><b>Hold exercise if glucose:</b> &lt;100 mg/dL (give snack first) or &gt;300 mg/dL.<br><b>Hypo signs:</b> diaphoresis, tremor, confusion, tachycardia, weakness.<br><b>Metformin:</b> low hypoglycemia risk, safe for exercise.<br><b>SGLT-2 inhibitors:</b> dehydration risk — ensure adequate hydration."},
  {cat:"medications",sub:"bone",front:"Osteoporosis medications — PT implications",back:"<b>Bisphosphonates</b> (alendronate): ↓ vertebral and hip fracture risk. Lateral thigh pain with long-term use = atypical femoral fracture red flag.<br><b>Denosumab:</b> similar fracture protection (RANK-L inhibitor).<br><b>Teriparatide</b> (PTH): anabolic, limited to 2 years.<br><b>PT:</b> weight-bearing + resistance training additive to medications. Ca 1200 mg/day + Vit D 800–1000 IU/day required."},

  // ── SYSTEMIC DISEASE EFFECTS ──
  {cat:"systemic",sub:"cardiac",front:"Heart failure effects on PT",back:"↓ CO → exercise intolerance, early fatigue. Pulmonary congestion → dyspnea on exertion, orthopnea, crackles.<br><b>Hold exercise if:</b> weight gain &gt;2 lbs/24 hrs or &gt;5 lbs/week, dyspnea at rest, new S3, ↑ edema.<br><b>PT:</b> monitor daily weight, SpO2, HR, BP, RPE. Moderate aerobic exercise (40–60% HRR) is evidence-based for stable HF."},
  {cat:"systemic",sub:"cardiac",front:"Peripheral artery disease effects on function",back:"<b>Presentation:</b> intermittent claudication → rest pain → tissue loss (critical limb ischemia).<br>ABI &lt;0.4 = severe — exercise may be limited by ischemic rest pain.<br><b>Best PT Rx:</b> supervised walking to claudication onset, rest, repeat — better than stenting for functional outcomes.<br>Wound healing severely impaired with ABI &lt;0.5. Inspect feet each session."},
  {cat:"systemic",sub:"pulmonary",front:"COPD systemic effects",back:"Beyond lungs: skeletal muscle atrophy (primary exercise limiter — not dyspnea), cachexia, osteoporosis (steroids + inactivity), cardiovascular comorbidity, depression/anxiety.<br><b>PT:</b> resistance training addresses peripheral muscle dysfunction directly. Nutrition assessment: low BMI = poor prognosis.<br>Exercise is safe — does not cause exacerbations."},
  {cat:"systemic",sub:"neuro",front:"Parkinson's disease — systemic effects on PT",back:"<b>Autonomic:</b> orthostatic hypotension (assess before each session), constipation, bladder urgency.<br><b>Dysphagia:</b> aspiration risk — refer to SLP.<br><b>Mood:</b> depression/anxiety very common — affects motivation.<br><b>PT:</b> implicit learning, external cues, avoid dual-task early in gait training."},
  {cat:"systemic",sub:"msk",front:"Rheumatoid arthritis — systemic effects on PT",back:"<b>Extra-articular:</b> atlantoaxial instability (C1–C2), pulmonary fibrosis, pericarditis, vasculitis, peripheral neuropathy, anemia.<br><b>Medications:</b> methotrexate (hepatotoxic), biologics (↑ infection risk).<br><b>PT:</b> resistance + aerobic during remission. Reduce load during flare (AROM, aquatic).<br>Never manipulate cervically — atlantoaxial instability risk."},
  {cat:"systemic",sub:"msk",front:"Osteoporosis — functional effects and PT",back:"<b>Vertebral compression fractures:</b> kyphosis, height loss, chronic pain, restrictive pulmonary pattern.<br><b>Hip fractures:</b> major morbidity/mortality — 20–30% die within 1 year.<br><b>PT:</b> weight-bearing + resistance exercise (Wolff's law). Avoid spinal flexion loading, high-impact.<br><b>DEXA:</b> T-score ≤-2.5 = osteoporosis | -1.0 to -2.5 = osteopenia."},
  {cat:"systemic",sub:"gi",front:"Hepatic disease — PT implications",back:"<b>Cirrhosis:</b> coagulopathy (avoid contact), portal HTN → esophageal varices (avoid Valsalva), ascites (limits diaphragm), hepatic encephalopathy (impairs motor learning).<br><b>Exercise:</b> low-moderate intensity safe in compensated cirrhosis.<br><b>Avoid:</b> heavy resistance (Valsalva + varices), contact sports.<br><b>Refer:</b> new jaundice, significant ascites, encephalopathy."},
  {cat:"systemic",sub:"renal",front:"Chronic kidney disease — PT implications",back:"<b>Anemia</b> (↓ EPO): early fatigue, dyspnea — check Hgb before exercise.<br><b>Peripheral neuropathy:</b> sensory loss, balance impairment.<br><b>Renal osteodystrophy:</b> fracture risk.<br><b>Dialysis patients:</b> exercise on non-dialysis days preferred (fatigue + hemodynamic instability post-dialysis).<br>Exercise safe and beneficial — improves function, QOL, may slow progression."},

  // ── ONCOLOGY ──
  {cat:"oncology",sub:"cancer",front:"Cancer rehab — PT framework",back:"<b>Preventive:</b> pre-treatment — optimize baseline.<br><b>Restorative:</b> post-treatment — return to prior function.<br><b>Supportive:</b> during treatment — manage side effects.<br><b>Palliative:</b> advanced disease — comfort, function, QOL.<br><b>Cancer-related fatigue (CRF):</b> most common and disabling symptom — exercise is the best evidence-based intervention."},
  {cat:"oncology",sub:"cancer",front:"Cancer-related fatigue (CRF)",back:"Affects 80–100% during treatment, persists in 30% of survivors.<br>Not relieved by rest, disproportionate to activity.<br><b>Best evidence:</b> aerobic + resistance training during and after treatment.<br><b>PT:</b> graded exercise prescription, energy conservation, pacing, sleep hygiene.<br>Absolute rest is harmful — perpetuates deconditioning and worsens fatigue."},
  {cat:"oncology",sub:"cancer",front:"Bone metastasis — PT precautions",back:"<b>Common sites:</b> vertebral column (most common), pelvis, proximal femur, proximal humerus.<br><b>Mirels score ≥9:</b> prophylactic fixation before WB — no WB until surgical stabilization.<br><b>Vertebral mets:</b> no spinal loading/twisting, log roll, brace if prescribed.<br><b>Pathological fracture signs:</b> acute severe pain with minimal mechanism — stop, immobilize, refer urgently."},
  {cat:"oncology",sub:"cancer",front:"Post-mastectomy PT",back:"<b>Axillary web syndrome (cording):</b> tight fibrous cords axilla → medial arm — limits shoulder ER/abduction. Tx: progressive mobilization, nerve gliding, manual therapy.<br><b>Lymphedema risk:</b> 20–30% post-ALND, lower with SLNB.<br><b>PT:</b> early ROM (within 48 hrs of drain removal), progressive strengthening.<br>Resistance training does NOT ↑ lymphedema risk — strongly supported."},
  {cat:"oncology",sub:"cancer",front:"Prostate cancer — PT implications",back:"<b>ADT (androgen deprivation therapy):</b> ↓ muscle, ↑ fat, osteoporosis, fatigue, cardiovascular risk, cognitive changes.<br><b>PT:</b> resistance + aerobic training counteract ADT effects — critical for this population.<br><b>Post-prostatectomy:</b> pelvic floor PT for urinary incontinence — first-line treatment (Kegels with correct technique).<br>Bone mets common — screen for precautions."},
  {cat:"oncology",sub:"chemo",front:"Chemotherapy side effects — PT implications",back:"<b>CIPN</b> (paclitaxel, platinum): sensory loss, balance impairment, fall risk.<br><b>Cardiotoxicity</b> (doxorubicin): cardiomyopathy → HF — monitor HR, BP, exercise tolerance.<br><b>Pulmonary toxicity</b> (bleomycin): fibrosis → restrictive — SpO2 monitoring.<br><b>Myelosuppression:</b> neutropenia (↑ infection), thrombocytopenia (↑ bleeding), anemia (↓ exercise tolerance).<br>Adjust intensity to current labs."},
  {cat:"oncology",sub:"chemo",front:"Radiation therapy effects — PT implications",back:"<b>Acute:</b> skin reaction (avoid friction/heat over field), fatigue, local inflammation.<br><b>Late:</b> fibrosis (mobilize early to prevent — most effective strategy), lymphedema, radiation neuropathy, cognitive effects ('chemo brain').<br><b>Chest radiation:</b> pulmonary fibrosis, cardiac toxicity.<br><b>Pelvic radiation:</b> bowel/bladder dysfunction, pelvic floor effects."},
  {cat:"oncology",sub:"chemo",front:"Exercise during chemotherapy — safety thresholds",back:"<b>Hold exercise:</b> fever &gt;38°C, symptomatic anemia (Hgb &lt;8 g/dL), platelets &lt;50K (contact/impact).<br><b>Caution:</b> ANC &lt;1.0 K/µL (avoid public pools/gyms).<br>Moderate aerobic + resistance generally safe during treatment — ↓ CRF, maintains function, ↑ QOL.<br>Verify current labs before each session — adjust to current status, not pre-treatment baseline."},

  // ── ENDOCRINE ──
  {cat:"endocrine",sub:"diabetes",front:"Diabetes — systemic complications relevant to PT",back:"<b>Peripheral neuropathy:</b> LOPS → undetected wounds → ulceration → amputation.<br><b>PVD:</b> impaired wound healing, claudication.<br><b>Retinopathy:</b> fall risk, avoid Valsalva/contact/high-impact (proliferative).<br><b>Autonomic neuropathy:</b> orthostatic hypotension, blunted HR response (use RPE).<br><b>MSK:</b> adhesive capsulitis, Dupuytren's, limited joint mobility (collagen glycosylation)."},
  {cat:"endocrine",sub:"diabetes",front:"Diabetes — exercise guidelines",back:"<b>Target glucose before exercise:</b> 100–250 mg/dL.<br><b>Hold:</b> &lt;100 mg/dL (snack first) or &gt;300 mg/dL.<br><b>Check glucose:</b> before, during (&gt;45 min), and after.<br><b>Hypo treatment:</b> 15-15 rule — 15g fast-acting carb, recheck in 15 min.<br><b>FITT:</b> 150 min/week moderate aerobic, resistance 2–3×/week, no more than 2 consecutive rest days."},
  {cat:"endocrine",sub:"diabetes",front:"Diabetic foot — assessment and management",back:"<b>Monofilament test</b> (10g): inability to feel = LOPS.<br><b>Inspect every session:</b> blisters, callus, wounds, nail changes, maceration.<br><b>Footwear:</b> therapeutic shoes — no bare feet.<br><b>Offloading gold standard:</b> total contact cast.<br><b>Charcot arthropathy:</b> acute warm swollen foot + neuropathy + no fever = NWB until acute phase resolved. Often misdiagnosed as infection."},
  {cat:"endocrine",sub:"thyroid",front:"Hypothyroidism — PT implications",back:"<b>Signs:</b> fatigue, cold intolerance, weight gain, bradycardia, constipation, depression, delayed reflexes (hung-up).<br><b>MSK:</b> proximal myopathy, carpal tunnel syndrome, myalgia.<br><b>PT:</b> fatigue management, progressive exercise as tolerated, screen for carpal tunnel.<br><b>Myxedema</b> (severe): non-pitting edema — urgent referral."},
  {cat:"endocrine",sub:"thyroid",front:"Hyperthyroidism — PT implications",back:"<b>Signs:</b> heat intolerance, weight loss, tachycardia, palpitations, tremor, anxiety, exophthalmos (Graves').<br><b>MSK:</b> proximal myopathy, osteoporosis.<br><b>Exercise:</b> cardiovascular response exaggerated — use RPE, not target HR. Check rhythm before exercise (↑ AF risk).<br><b>Thyroid storm:</b> high fever + tachycardia + altered mental status = emergency."},
  {cat:"endocrine",sub:"bone",front:"Osteoporosis — screening, diagnosis, PT",back:"<b>DEXA T-score:</b> ≥-1.0 = normal | -1.0 to -2.5 = osteopenia | ≤-2.5 = osteoporosis.<br><b>FRAX:</b> 10-year fracture probability.<br><b>PT exercise:</b> weight-bearing aerobic + progressive resistance — most effective combination.<br>Avoid spinal flexion loading in severe osteoporosis. Fall prevention program critical."},
  {cat:"endocrine",sub:"bone",front:"Charcot arthropathy",back:"Neuropathic arthropathy — progressive bone/joint destruction from undetected trauma in insensate foot.<br><b>Acute phase:</b> warm, erythematous, swollen foot — often confused with cellulitis or gout.<br><b>Key distinction:</b> no fever/leukocytosis in Charcot (vs infection).<br><b>Management:</b> NWB (TCC) until acute phase resolves (skin temp normalizes).<br>Any acute warm foot in neuropathic patient = refer before WB."},

  // ── IMMUNOLOGICAL / RHEUMATOLOGICAL ──
  {cat:"immune",sub:"rheum",front:"Rheumatoid arthritis — PT management",back:"Symmetrical small joint involvement (MCPs, PIPs, wrists) — spares DIPs. Morning stiffness &gt;1 hour.<br><b>PT:</b> resistance + aerobic during remission. Reduce load during flare (AROM, aquatic). Splinting, energy conservation.<br><b>Precautions:</b> atlantoaxial instability — never manipulate cervically. Swan neck/boutonniere — avoid provocative positions."},
  {cat:"immune",sub:"rheum",front:"Seronegative spondyloarthropathies",back:"Includes: ankylosing spondylitis, psoriatic arthritis, reactive arthritis, IBD-associated arthritis.<br><b>Shared features:</b> HLA-B27, asymmetric large joint + SI involvement, enthesitis, uveitis.<br><b>Ankylosing spondylitis:</b> progressive spinal fusion ('bamboo spine').<br><b>PT:</b> extension exercises (counters kyphotic tendency), deep breathing, swimming. Schober test measures lumbar mobility."},
  {cat:"immune",sub:"rheum",front:"Gout and pseudogout",back:"<b>Gout:</b> uric acid crystals — 1st MTP most common (podagra). Acute: hot, swollen joint.<br><b>Pseudogout:</b> calcium pyrophosphate crystals — knee most common.<br><b>Acute flare:</b> rest, ice, NSAIDs/colchicine. PT: avoid loading affected joint.<br>Between attacks: normal exercise. Tophaceous gout: skin breakdown risk at tophi sites."},
  {cat:"immune",sub:"rheum",front:"Systemic lupus erythematosus (SLE)",back:"Multi-system autoimmune — predominantly young women.<br><b>Features:</b> malar rash, photosensitivity, serositis, nephritis, non-erosive arthritis, cytopenias.<br><b>PT:</b> fatigue (energy conservation), photosensitivity (indoor exercise or sun protection), AVN (corticosteroids → femoral head), osteoporosis, cardiovascular risk.<br>Moderate exercise safe — ↓ fatigue and CV risk."},
  {cat:"immune",sub:"autoimmune",front:"Myositis — polymyositis and dermatomyositis",back:"<b>Polymyositis:</b> proximal bilateral muscle weakness, no rash, ↑ CK.<br><b>Dermatomyositis:</b> same + heliotrope rash (periorbital), Gottron's papules (MCP/PIP).<br><b>Malignancy association:</b> dermatomyositis — screen for occult cancer.<br><b>PT:</b> ROM only during flare. Progressive resistance training during stable disease — does not worsen inflammation.<br>Distinguish from steroid myopathy (normal CK)."},
  {cat:"immune",sub:"autoimmune",front:"Scleroderma (systemic sclerosis)",back:"<b>Limited (CREST):</b> Calcinosis, Raynaud's, Esophageal dysmotility, Sclerodactyly, Telangiectasia.<br><b>Diffuse:</b> widespread skin + organ fibrosis (lungs, kidneys, heart, GI).<br><b>Raynaud's:</b> vasospasm with cold — no cold modalities, protect from cold.<br><b>PT:</b> hand/facial ROM exercises, breathing exercises (pulmonary fibrosis). Avoid aggressive joint mobilization (fragile skin)."},
  {cat:"immune",sub:"autoimmune",front:"Fibromyalgia",back:"Chronic widespread pain + fatigue + sleep disturbance + cognitive dysfunction ('fibro fog').<br>No inflammatory markers, no structural pathology.<br><b>Mechanism:</b> central sensitization — amplified pain processing.<br><b>Best evidence:</b> graded aerobic exercise (↓ pain, fatigue, sleep issues). Start very low, progress slowly.<br>CBT + exercise most effective. Educate on pain neuroscience. Avoid passive treatment-dependent approaches."},
  {cat:"immune",sub:"autoimmune",front:"Sjögren's syndrome",back:"Autoimmune exocrinopathy — dry eyes + dry mouth (primary).<br>Secondary: associated with RA, SLE, scleroderma.<br><b>PT implications:</b> dry eyes (avoid fans/drafts during exercise), dry mouth (frequent water breaks essential), peripheral neuropathy (balance), fatigue (energy conservation), arthralgia.<br>Systemic: pulmonary, renal, CNS involvement possible."},
  {cat:"immune",sub:"general",front:"Immunosuppressed patients — PT precautions",back:"<b>Causes:</b> chemotherapy (neutropenia), HIV/AIDS, transplant (anti-rejection meds), high-dose steroids, biologic DMARDs.<br><b>PT precautions:</b> avoid public settings if ANC &lt;500/µL, no pools if severely neutropenic, hand hygiene critical, screen for fever before each session (&gt;38°C = hold).<br>Wound healing impaired. Opportunistic infections may present atypically — unexplained functional decline = refer."},
];
    _cards.forEach((c,i) => {
      c._deck = 'sysinteractions_cards_v1';
      c._id = c._id || ('card_' + i);
      c._label = 'System Interactions';
      c._color = '#D4537E';
      // normalise front/back for CN deck

      if(!c.back && c.functions) c.back = '<b>Functions:</b> ' + c.functions + '<br><b>If damaged:</b> ' + c.finding;
    });
    ALL_CARDS.push(..._cards);
  })();

   path:"<b>Cubital tunnel</b> (elbow — most common): ring/small numbness, intrinsic weakness, claw hand (4th/5th).<br><b>Guyon's canal</b> (wrist): hypothenar + intrinsic weakness, palmar sensory loss.<br><b>Froment's sign:</b> IP flexion when pinching (adductor pollicis weak)."},

    _cards.forEach((c,i) => {

      if(!c.front && c.name) c.front = 'CN ' + c.num + ' — ' + c.name;

    ALL_CARDS.push(..._cards);

const WEIGHTS={gotit:1,almost:2,nope:4,unrated:3};
const CONF_COLORS={gotit:{bg:'#E1F5EE',color:'#0F6E56'},almost:{bg:'#FAEEDA',color:'#854F0B'},nope:{bg:'#FCEBEB',color:'#A32D2D'}};
const CONF_LABELS={gotit:'Got it',almost:'Almost',nope:'Nope'};

let db=null, userRef=null;
let starredMap={};    // {deck_key: Set of card ids}
let confidence={};   // {globalId: 'gotit'|'almost'|'nope'}
let unstarredIds=new Set(); // removed from starred this session
let deck=[], idx=0, revealed=false;
let _history=[], sessionStart={}, sessionReviewed=new Set();
let autoTimer=null;

function globalId(c){ return c._deck + '::' + c._id; }
function confKey(c){ return confidence[globalId(c)]||'unrated'; }

function isStarred(c){
  const s=starredMap[c._deck];
  return s && s.has(c._id);
}

function setSyncStatus(state,msg){
  const dot=document.getElementById('syncDot');
  const txt=document.getElementById('syncTxt');
  dot.className='sync-dot'+(state?' '+state:'');
  txt.textContent=msg;
}

function buildDeck(){
  deck=ALL_CARDS.filter(c=>isStarred(c)&&!unstarredIds.has(globalId(c)));
  idx=0; revealed=false; _history=[];
}

function allRated(){return deck.length>0&&deck.every(c=>confKey(c)!=='unrated');}

function weightedNext(){
  const pool=[];
  deck.forEach((c,i)=>{
    if(i===idx)return;
    const w=WEIGHTS[confKey(c)]||1;
    for(let j=0;j<w;j++)pool.push(i);
  });
  if(!pool.length)return(idx+1)%deck.length;
  return pool[Math.floor(Math.random()*pool.length)];
}

function advanceCard(){
  cancelAuto();
  if(deck.length===0)return;
  _history.push(idx);
  if(_history.length>50)_history.shift();
  idx=allRated()?weightedNext():(idx+1)%deck.length;
  revealed=false; render();
}

function cancelAuto(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}}
function scheduleAutoAdvance(){
  if(autoTimer)clearTimeout(autoTimer);
  autoTimer=setTimeout(()=>advanceCard(),0);
}

function showToast(msg,duration=2500){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';t.style.opacity='1';
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>{t.style.display='none';},300);},duration);
}

function rate(val){
  cancelAuto();
  const c=deck[idx];
  const gid=globalId(c);
  const wasUnrated=!confidence[gid]||confidence[gid]==='unrated';
  confidence[gid]=val;
  if(wasUnrated&&allRated())showToast('All starred cards rated — spaced repetition active!',3000);
  saveConfidence();
  if(!revealed){revealed=true;render();scheduleAutoAdvance();}
  else{render();scheduleAutoAdvance();}
}

function unstar(){
  cancelAuto();
  const c=deck[idx];
  unstarredIds.add(globalId(c));
  // Remove from starredMap
  if(starredMap[c._deck])starredMap[c._deck].delete(c._id);
  // Save to Firebase
  saveStarForDeck(c._deck);
  deck=deck.filter((_,i)=>i!==idx);
  if(idx>=deck.length)idx=Math.max(0,deck.length-1);
  revealed=false; render();
  showToast('Card unstarred',1500);
}

function saveStarForDeck(deckKey){
  if(!db)return;
  const s=starredMap[deckKey]||new Set();
  const obj={};
  [...s].forEach((id,i)=>{ obj['s'+i]=id; });
  db.ref('users/'+USER_ID+'/starred/'+deckKey).set(obj).catch(e=>console.warn(e));
}

function saveConfidence(){
  if(!db)return;
  db.ref('users/'+USER_ID+'/starred_confidence').set(confidence).catch(e=>console.warn(e));
}

function go(dir){
  cancelAuto();
  if(dir===-1&&_history.length>0){idx=_history.pop();revealed=false;render();return;}
  if(dir===1){advanceCard();return;}
}

function shuffle(){
  cancelAuto();
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  idx=0;_history=[];revealed=false;render();
}

function updateProgressBar(){
  const total=deck.length;
  if(total===0){
    const bar=document.getElementById('progBar');
    if(bar)bar.innerHTML='<div class="prog-seg" style="background:var(--bg-secondary);width:100%;border-radius:3px;"></div>';
    return;
  }
  const gotit=deck.filter(c=>confidence[globalId(c)]==='gotit').length;
  const almost=deck.filter(c=>confidence[globalId(c)]==='almost').length;
  const nope=deck.filter(c=>confidence[globalId(c)]==='nope').length;
  const gp=Math.round(gotit/total*100);
  const ap=Math.round(almost/total*100);
  const np=Math.round(nope/total*100);
  const up=Math.max(0,100-gp-ap-np);
  const bar=document.getElementById('progBar');
  if(bar)bar.innerHTML=
    (gp>0?`<div class="prog-seg" style="background:#5DCAA5;width:${gp}%;"></div>`:'')+
    (ap>0?`<div class="prog-seg" style="background:#EF9F27;width:${ap}%;"></div>`:'')+
    (np>0?`<div class="prog-seg" style="background:#F09595;width:${np}%;"></div>`:'')+
    (up>0?`<div class="prog-seg" style="background:var(--bg-tertiary);width:${up}%;"></div>`:'');
  const txt=document.getElementById('progTxt');
  if(txt)txt.textContent=(idx+1)+' / '+deck.length;
}

function updateStats(){
  const gotit=deck.filter(c=>confidence[globalId(c)]==='gotit').length;
  const almost=deck.filter(c=>confidence[globalId(c)]==='almost').length;
  const nope=deck.filter(c=>confidence[globalId(c)]==='nope').length;
  document.getElementById('statsRow').innerHTML=
    '<div class="stat">Starred <span>'+deck.length+'</span></div>'+
    (gotit>0?'<div class="stat">Got it <span style="color:#0F6E56;">'+gotit+'</span></div>':'')+
    (almost>0?'<div class="stat">Almost <span style="color:#854F0B;">'+almost+'</span></div>':'')+
    (nope>0?'<div class="stat">Nope <span style="color:#A32D2D;">'+nope+'</span></div>':'');
}

function render(){
  updateStats();
  updateProgressBar();
  const area=document.getElementById('cardArea');
  const navRow=document.getElementById('navRow');
  if(deck.length===0){
    area.innerHTML='<div class="empty-state"><strong>No starred cards yet.</strong>Star cards in any deck using the ★ button on the card front.</div>';
    navRow.style.display='none';
    return;
  }
  navRow.style.display='flex';
  if(idx>=deck.length)idx=Math.max(0,deck.length-1);
  const c=deck[idx];
  const gid=globalId(c);
  sessionReviewed.add(gid);
  if(!(gid in sessionStart))sessionStart[gid]=confidence[gid]||'unrated';
  const conf=confidence[gid]||null;

  if(!revealed){
    const confBadge=conf?'<span class="conf-badge" style="background:'+CONF_COLORS[conf].bg+';color:'+CONF_COLORS[conf].color+';">'+CONF_LABELS[conf]+'</span>':'';
    area.innerHTML=`<div class="card card-front" onclick="toggle()">
      <div class="deck-tag" style="color:${c._color};">${c._label}</div>
      <div class="front-title">${c.front||''}</div>
      ${confBadge}
      <div class="star-badge">★</div>
      <div class="hint">Tap or Space to reveal</div>
    </div>`;
  } else {
    const canRemove=conf==='gotit';
    area.innerHTML=`<div class="card card-back" style="background:var(--bg-primary);border:0.5px solid var(--border);" onclick="handleBackClick(event)">
      <div class="back-title">${c.front||''}</div>
      <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.07em;font-weight:500;color:${c._color};margin-bottom:10px;display:block;">${c._label}</span>
      <div class="divider"></div>
      <div class="blbl">Key facts</div>
      <div class="bval">${c.back||''}</div>
      <div class="spacer"></div>
      <div class="confidence-row" onclick="event.stopPropagation()">
        <span class="conf-lbl">Confidence:</span>
        <button class="cbtn cbtn-nope${conf==='nope'?' selected':''}" onclick="rate('nope')">Nope</button>
        <button class="cbtn cbtn-almost${conf==='almost'?' selected':''}" onclick="rate('almost')">Almost</button>
        <button class="cbtn cbtn-gotit${conf==='gotit'?' selected':''}" onclick="rate('gotit')">Got it</button>
        ${canRemove?'<button class="remove-btn" onclick="unstar()">Unstar</button>':''}
        <button class="unstar-btn" onclick="unstar()">★ Remove</button>
      </div>
      <div class="flip-hint">Space to flip · 1 Nope · 2 Almost · 3 Got it · ← → navigate</div>
    </div>`;
  }
}

function handleBackClick(e){if(!e.target.closest('.confidence-row'))toggle();}
function toggle(){revealed=!revealed;render();}

function finishStudying(e){
  e.preventDefault();
  const reviewed=sessionReviewed.size;
  if(reviewed===0){window.location.href='index.html';return;}
  let moved=[];
  sessionReviewed.forEach(gid=>{
    const before=sessionStart[gid]||'unrated';
    const after=confidence[gid]||'unrated';
    if(before!==after)moved.push({before,after});
  });
  const upgrades=moved.filter(m=>(m.before==='unrated'&&m.after!=='unrated')||(m.before==='nope'&&(m.after==='almost'||m.after==='gotit'))||(m.before==='almost'&&m.after==='gotit')).length;
  const downgrades=moved.filter(m=>(m.before==='gotit'&&m.after!=='gotit')||(m.before==='almost'&&m.after==='nope')).length;
  const gotit=deck.filter(c=>confidence[globalId(c)]==='gotit').length;
  const almost=deck.filter(c=>confidence[globalId(c)]==='almost').length;
  const nope=deck.filter(c=>confidence[globalId(c)]==='nope').length;
  let html=`<div style="margin-bottom:10px;"><strong style="color:var(--text-primary);">Cards reviewed:</strong> ${reviewed}</div>`;
  if(upgrades>0)html+=`<div style="color:#0F6E56;">↑ ${upgrades} card${upgrades>1?'s':''} improved</div>`;
  if(downgrades>0)html+=`<div style="color:#A32D2D;">↓ ${downgrades} card${downgrades>1?'s':''} moved down</div>`;
  html+=`<div style="margin-top:12px;padding-top:12px;border-top:0.5px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;">`;
  if(gotit>0)html+=`<span style="color:#0F6E56;">Got it: ${gotit}</span>`;
  if(almost>0)html+=`<span style="color:#854F0B;">Almost: ${almost}</span>`;
  if(nope>0)html+=`<span style="color:#A32D2D;">Nope: ${nope}</span>`;
  html+=`</div>`;
  document.getElementById('summaryBody').innerHTML=html;
  document.getElementById('summaryModal').style.display='flex';
}

function closeSummary(){document.getElementById('summaryModal').style.display='none';}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(document.getElementById('summaryModal').style.display==='flex')return;
  switch(e.key){
    case ' ':case 'Spacebar':e.preventDefault();if(deck.length>0)toggle();break;
    case 'ArrowRight':e.preventDefault();go(1);break;
    case 'ArrowLeft':e.preventDefault();go(-1);break;
    case '1':if(revealed)rate('nope');break;
    case '2':if(revealed)rate('almost');break;
    case '3':if(revealed)rate('gotit');break;
  }
});

// Load from Firebase
function initFirebase(){
  if(typeof firebase==='undefined'){setTimeout(initFirebase,100);return;}
  try{
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database();
    setSyncStatus('pending','Loading starred cards...');
    // Load all starred sets + confidence
    Promise.all([
      db.ref('users/'+USER_ID+'/starred').once('value'),
      db.ref('users/'+USER_ID+'/starred_confidence').once('value')
    ]).then(([starSnap, confSnap])=>{
      const starData=starSnap.val()||{};
      Object.entries(starData).forEach(([deckKey, ids])=>{
        starredMap[deckKey]=new Set(Object.values(ids));
      });
      confidence=confSnap.val()||{};
      buildDeck();
      setSyncStatus('ok', deck.length + ' starred cards loaded');
      render();
    }).catch(e=>{
      setSyncStatus('err','Could not load starred cards');
      console.warn(e);
      render();
    });
  }catch(e){setSyncStatus('err','Firebase error');console.warn(e);}
}

// Initial render while Firebase loads
render();
</script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>initFirebase();</script>

  {cat:"ecg",sys:"cardiac",front:"Atrial fibrillation",back:"Irregularly irregular rhythm. No distinct P waves — chaotic baseline.<br><b>Rate:</b> variable (60–160+ uncontrolled).<br><b>PT:</b> exercise appropriate if rate-controlled. Do not exercise if ventricular rate &gt;100 at rest or hemodynamically unstable.<br><b>Risk:</b> stroke — anticoagulation required."},
  {cat:"ecg",sys:"cardiac",front:"Atrial flutter",back:"Regular atrial rate 250–350 bpm — sawtooth flutter waves (best in II, III, aVF).<br><b>Ventricular rate:</b> typically 2:1 block → 150 bpm.<br><b>vs AF:</b> regular rhythm + distinct flutter waves.<br>Similar stroke risk to AF."},
  {cat:"ecg",sys:"cardiac",front:"Heart blocks — first, second, third degree",back:"<b>1st:</b> PR &gt;0.20 sec, every P conducts — benign.<br><b>2nd Mobitz I (Wenckebach):</b> PR progressively lengthens → dropped QRS — usually benign.<br><b>2nd Mobitz II:</b> constant PR, sudden dropped QRS — may need pacemaker.<br><b>3rd (complete):</b> P and QRS independent — pacemaker required."},
  {cat:"ecg",sys:"cardiac",front:"ST changes — ischemia vs infarction",back:"<b>ST depression:</b> subendocardial ischemia / NSTEMI.<br><b>ST elevation ≥1mm in 2 contiguous leads:</b> STEMI — call EMS.<br><b>Pathological Q waves:</b> old infarction (permanent).<br><b>During exercise:</b> new ST changes = stop, 12-lead ECG, call EMS."},
  {cat:"ecg",sys:"cardiac",front:"Ventricular tachycardia (VT)",back:"≥3 ventricular beats at &gt;100 bpm. Wide QRS, regular, no P waves.<br><b>Sustained VT (&gt;30 sec):</b> hemodynamic compromise → cardioversion.<br><b>Torsades:</b> polymorphic VT + prolonged QT.<br><b>PT:</b> stop exercise immediately, call EMS, prepare for defibrillation."},
  {cat:"ecg",sys:"cardiac",front:"Ventricular fibrillation (VF)",back:"Chaotic ventricular rhythm — no cardiac output. Fatal without immediate defibrillation.<br><b>ECG:</b> irregular chaotic waveforms, no QRS.<br><b>Treatment:</b> CPR + unsynchronized defibrillation.<br><b>PT:</b> CPR → AED. Chain of survival: recognize → EMS → CPR → defibrillate."},
  {cat:"ecg",sys:"cardiac",front:"PVCs (premature ventricular contractions)",back:"Early, wide (&gt;0.12 sec), bizarre QRS without P wave — compensatory pause follows.<br><b>Bigeminy:</b> every other beat PVC. <b>Trigeminy:</b> every third.<br><b>Isolated PVCs:</b> benign in healthy patients.<br><b>Notify physician + stop:</b> frequent PVCs (&gt;10–30/hr) or R-on-T phenomenon."},
  {cat:"ecg",sys:"cardiac",front:"Bundle branch blocks",back:"<b>LBBB:</b> wide QRS, broad notched R in I/aVL/V5–V6, deep S in V1.<br><b>RBBB:</b> wide QRS, RSR' (rabbit ears) in V1–V2, wide S in I/V5–V6.<br><b>New LBBB + chest pain:</b> treat as STEMI.<br>Do not use ST changes for ischemia in LBBB."},
  {cat:"ecg",sys:"cardiac",front:"Graded exercise test (GXT) — termination criteria",back:"<b>Absolute stop:</b> SBP drop &gt;10 mmHg + ischemia, ST elevation &gt;1mm, VT, poor perfusion signs.<br><b>Relative stop:</b> ST depression &gt;2mm, increasing angina, SBP &gt;250/DBP &gt;115, significant arrhythmia.<br><b>Submaximal target:</b> 85% of age-predicted HRmax (220 − age)."},

  // ── CARDIAC REHAB ──
  {cat:"rehab",sys:"cardiac",front:"Cardiac rehab — 4 phases",back:"<b>Phase I</b> (inpatient): low-intensity ambulation, education, risk stratification.<br><b>Phase II</b> (outpatient): 36 sessions, 3×/wk, 8–12 weeks, ECG monitoring.<br><b>Phase III</b> (community): less monitoring, maintain gains.<br><b>Phase IV</b> (independent): lifelong maintenance. Aerobic primary; resistance added Phase II onward."},
  {cat:"rehab",sys:"cardiac",front:"Exercise prescription — cardiac rehab",back:"<b>Frequency:</b> 3–5×/week &nbsp; <b>Intensity:</b> 40–80% HRR or RPE 11–14<br><b>Time:</b> 20–60 min &nbsp; <b>Type:</b> walking, cycling, rowing<br><b>Resistance:</b> 40–60% 1RM, 8–15 reps, 2–3 sets — after 4–6 weeks aerobic base.<br><b>Beta-blockers:</b> use RPE."},
  {cat:"rehab",sys:"cardiac",front:"Karvonen formula (HRR method)",back:"Target HR = [(HRmax − HRrest) × intensity%] + HRrest<br><b>Example:</b> HRmax 160, HRrest 70, 60%: [(160−70) × 0.60] + 70 = <b>124 bpm</b><br><b>No GXT:</b> estimate HRmax = 220 − age.<br><b>Beta-blockers:</b> use RPE or measured HRmax from GXT."},
  {cat:"rehab",sys:"cardiac",front:"Exercise contraindications — cardiac",back:"<b>Absolute:</b> unstable angina, uncontrolled arrhythmia, decompensated HF, severe aortic stenosis, acute MI &lt;2 days, active pericarditis/myocarditis, acute PE/DVT.<br><b>Relative:</b> SBP &gt;180/DBP &gt;110, resting HR &gt;100, electrolyte abnormalities.<br>Always check vitals before each session."},
  {cat:"rehab",sys:"cardiac",front:"NYHA functional classification",back:"<b>I:</b> no symptoms with ordinary activity.<br><b>II:</b> slight limitation — symptoms with moderate exertion.<br><b>III:</b> marked limitation — symptoms with minimal exertion.<br><b>IV:</b> symptoms at rest.<br><b>PT:</b> Class I–III benefit from supervised exercise. Class IV: very low-level, symptom-guided."},
  {cat:"rehab",sys:"cardiac",front:"Post-CABG / sternotomy precautions",back:"<b>Sternal precautions (6–8 weeks):</b> no pushing/pulling &gt;5–10 lbs, no bilateral arm elevation &gt;90° with resistance, no trunk twisting.<br><b>Bed mobility:</b> log roll.<br><b>Coughing:</b> splint sternum with pillow.<br><b>Monitor:</b> wound drainage, redness, dehiscence. Compression stockings for leg graft."},
  {cat:"rehab",sys:"pulmonary",front:"Pulmonary rehab — key components",back:"<b>Primary:</b> aerobic + resistance exercise training.<br><b>Also includes:</b> education, breathing strategies, energy conservation, exacerbation action plan, psychosocial support.<br><b>Outcomes:</b> ↑ exercise tolerance, ↓ dyspnea, ↑ QOL.<br><b>Note:</b> does NOT change FEV1 or slow disease progression."},
  {cat:"rehab",sys:"pulmonary",front:"Airway clearance techniques",back:"<b>ACBT:</b> breathing control → thoracic expansion → forced expiration (huff).<br><b>Autogenic drainage:</b> 3-phase breathing — unstick → collect → evacuate.<br><b>PEP:</b> maintains airway patency on expiration.<br><b>Oscillating PEP</b> (Acapella, Flutter, vest): adds vibration to loosen secretions.<br><b>Postural drainage:</b> gravity-assisted positioning."},
  {cat:"rehab",sys:"pulmonary",front:"Breathing strategies — PT interventions",back:"<b>Pursed lip breathing:</b> slows expiration, ↓ air trapping — indicated in COPD.<br><b>Diaphragmatic breathing:</b> ↑ tidal volume, ↓ accessory muscle use.<br><b>Forward lean (tripod):</b> unloads accessory muscles, optimizes diaphragm.<br><b>Paced breathing:</b> coordinate breathing with activity to ↓ dyspnea."},

  // ── ASSESSMENT ──
  {cat:"assessment",sys:"cardiac",front:"Auscultation — heart sounds",back:"<b>S1:</b> mitral + tricuspid closure (start of systole).<br><b>S2:</b> aortic + pulmonic closure (end of systole).<br><b>S3:</b> early diastole — volume overload / HF ('Kentucky: lub-dub-ta').<br><b>S4:</b> late diastole — stiff ventricle — HTN, HCM ('Tennessee: ta-lub-dub').<br>S3 in adults &gt;40 = pathological."},
  {cat:"assessment",sys:"cardiac",front:"Auscultation — murmurs",back:"<b>Systolic</b> (S1→S2): aortic stenosis (harsh, radiates to neck), mitral regurg (holosystolic, apex to axilla), MVP (late systolic click).<br><b>Diastolic</b> (S2→S1): aortic regurg (blowing, decrescendo), mitral stenosis (low rumble).<br>Diastolic murmurs = always pathological."},
  {cat:"assessment",sys:"pulmonary",front:"Auscultation — breath sounds",back:"<b>Vesicular:</b> normal (most lung fields) — soft, low-pitched.<br><b>Bronchial:</b> over trachea — loud, expiration &gt; inspiration.<br><b>Decreased/absent:</b> pneumothorax, pleural effusion, obesity.<br><b>Bronchial sounds in periphery:</b> consolidation (pneumonia)."},
  {cat:"assessment",sys:"pulmonary",front:"Adventitious breath sounds",back:"<b>Fine crackles:</b> early inspiration — fibrosis, early HF.<br><b>Coarse crackles:</b> inspiration + expiration — secretions, pneumonia.<br><b>Wheeze:</b> expiratory, high-pitched — asthma, COPD.<br><b>Stridor:</b> inspiratory, high-pitched — upper airway obstruction (emergency).<br><b>Rhonchi:</b> low gurgling — large airway secretions (clears with cough)."},
  {cat:"assessment",sys:"pulmonary",front:"Percussion — chest",back:"<b>Resonant:</b> normal lung.<br><b>Dull:</b> consolidation, pleural effusion, mass.<br><b>Hyperresonant:</b> pneumothorax, emphysema.<br><b>Flat:</b> large effusion, atelectasis.<br><b>Technique:</b> finger on chest, tap middle phalanx — compare bilaterally at same levels."},
  {cat:"assessment",sys:"cardiac",front:"Jugular venous distension (JVD)",back:"Estimated right atrial pressure via internal jugular vein.<br><b>Measure:</b> patient at 45°, pulsation above clavicle.<br><b>Normal:</b> &lt;3–4 cm above sternal angle.<br><b>JVD &gt;4 cm:</b> ↑ CVP — right HF, tamponade, tension pneumothorax.<br><b>Hepatojugular reflux:</b> liver pressure → ↑ JVD = right HF."},
  {cat:"assessment",sys:"both",front:"Dyspnea scales — MRC and mBorg",back:"<b>MRC (0–4):</b> 0=none except strenuous | 1=hurrying/hills | 2=slower than peers | 3=stops after 100m | 4=too breathless to leave house.<br><b>Modified Borg (0–10):</b> used during exercise — target ≤3 for moderate intensity.<br>Both guide exercise intensity and monitor treatment response."},
  {cat:"assessment",sys:"cardiac",front:"Ankle-brachial index (ABI)",back:"ABI = ankle SBP ÷ highest brachial SBP.<br><b>Normal:</b> 1.0–1.4 &nbsp; <b>Borderline:</b> 0.9–1.0 &nbsp; <b>Mild PAD:</b> 0.7–0.9<br><b>Moderate:</b> 0.4–0.7 &nbsp; <b>Severe:</b> &lt;0.4 &nbsp; <b>Non-compressible:</b> &gt;1.4<br>ABI &lt;0.9 confirms PAD."},
  {cat:"assessment",sys:"pulmonary",front:"Clubbing",back:"Bulbous fingertips — loss of normal nail-bed angle (Schamroth's sign: diamond gap disappears).<br><b>Associated with:</b> chronic hypoxemia (COPD, CF, bronchiectasis), pulmonary fibrosis, lung cancer, cyanotic heart disease.<br>Not reversible. Indicates significant chronic cardiopulmonary disease."},
  {cat:"assessment",sys:"pulmonary",front:"Cyanosis — central vs peripheral",back:"<b>Central:</b> bluish lips/tongue/mucosa — significant hypoxemia (SpO2 &lt;85%), cardiopulmonary disease.<br><b>Peripheral:</b> bluish hands/feet, normal central — vasoconstriction, cold, venous stasis.<br><b>PT:</b> central cyanosis = stop, check SpO2, O2, notify physician."},

  // ── PHARMACOLOGY ──
  {cat:"pharm",sys:"cardiac",front:"Beta-blockers — PT implications",back:"<b>Examples:</b> metoprolol, atenolol, carvedilol.<br><b>Use:</b> HTN, HF, angina, post-MI, arrhythmia.<br><b>Effect:</b> blunts HR and BP response to exercise.<br><b>PT:</b> use RPE — not target HR. Resting bradycardia expected. Do NOT stop abruptly (rebound angina risk)."},
  {cat:"pharm",sys:"cardiac",front:"Nitrates — PT implications",back:"<b>Examples:</b> nitroglycerin (SL), isosorbide.<br><b>Effect:</b> venodilation → ↓ preload → ↓ myocardial O2 demand.<br><b>Angina protocol:</b> stop → rest → 1 tab SL q5 min × 3 → EMS if no relief.<br><b>Side effects:</b> orthostatic hypotension, headache."},
  {cat:"pharm",sys:"cardiac",front:"Diuretics — PT implications",back:"<b>Types:</b> furosemide (loop), HCTZ (thiazide), spironolactone (K-sparing).<br><b>Use:</b> HF, HTN, edema.<br><b>PT:</b> orthostatic hypotension risk — check BP with position change. Loop/thiazide → hypokalemia → arrhythmia risk. Schedule PT around morning diuresis."},
  {cat:"pharm",sys:"cardiac",front:"Anticoagulants — PT implications",back:"<b>Types:</b> warfarin (INR), heparin, NOACs (apixaban, rivaroxaban).<br><b>Use:</b> AF, DVT, PE, mechanical valves.<br><b>PT:</b> ↑ bleeding risk — falls prevention critical. Monitor for bleeding signs (bruising, hematuria). DVT on anticoagulation: ambulation encouraged."},
  {cat:"pharm",sys:"cardiac",front:"Statins — PT implications",back:"<b>Examples:</b> atorvastatin, rosuvastatin, simvastatin.<br><b>Use:</b> hyperlipidemia, CAD prevention.<br><b>PT:</b> monitor for statin myopathy — unexplained muscle pain, weakness, dark urine. Elevated CK + symptoms = notify MD, hold exercise. Worsened by high-intensity exercise."},
];
    _cards.forEach((c,i) => {
      c._deck = 'cardiopulm_cards_v1';
      c._id = c._id || ('card_' + i);
      c._label = 'Cardiopulmonary';
      c._color = '#D85A30';
      // normalise front/back for CN deck
      if(!c.front && c.name) c.front = 'CN ' + c.num + ' — ' + c.name;
      if(!c.back && c.functions) c.back = '<b>Functions:</b> ' + c.functions + '<br><b>If damaged:</b> ' + c.finding;
    });
    ALL_CARDS.push(..._cards);
  })();

  (function(){
    const _cards = [
  // ── WOUND CLASSIFICATION ──
  {cat:"classification",front:"Pressure injury staging (NPIAP)",back:"<b>Stage 1:</b> intact skin, non-blanchable erythema.<br><b>Stage 2:</b> partial thickness — open blister or shallow crater, dermis exposed.<br><b>Stage 3:</b> full thickness — subcutaneous tissue visible, no bone/tendon/muscle.<br><b>Stage 4:</b> full thickness — bone, tendon, or muscle exposed.<br><b>Unstageable:</b> base obscured by slough/eschar.<br><b>DTI:</b> intact skin, purple/maroon discoloration or blood-filled blister — deep damage."},
  {cat:"classification",front:"Pressure injury — risk and locations",back:"<b>High-risk sites:</b> sacrum (most common), ischial tuberosities, greater trochanters, heels, malleoli, occiput.<br><b>Braden Scale</b> (6 domains: sensory perception, moisture, activity, mobility, nutrition, friction/shear):<br>≤18 = at risk &nbsp; ≤12 = high risk. Lower score = higher risk."},
  {cat:"classification",front:"Wagner wound classification (diabetic foot)",back:"<b>0:</b> intact skin. <b>1:</b> superficial ulcer (dermis). <b>2:</b> deep — tendon/capsule/bone.<br><b>3:</b> deep + osteomyelitis or abscess. <b>4:</b> forefoot gangrene. <b>5:</b> whole foot gangrene.<br>Grade 3+ = urgent surgical referral."},
  {cat:"classification",front:"Wound depth classification",back:"<b>Superficial:</b> epidermis only — heals by regeneration, no scar.<br><b>Partial thickness:</b> epidermis + part of dermis — heals by epithelialization, minimal scar.<br><b>Full thickness:</b> through entire dermis — heals by granulation, contraction, epithelialization — significant scar.<br><b>Subdermal:</b> into muscle/bone — surgical intervention required."},
  {cat:"classification",front:"Wound etiology — major types",back:"<b>Pressure:</b> bony prominence + external force.<br><b>Arterial:</b> ischemic, distal, painful, punched-out.<br><b>Venous:</b> medial lower leg, irregular, wet, minimal pain.<br><b>Neuropathic/diabetic:</b> plantar, painless, callus rim.<br>Etiology determines treatment approach."},
  {cat:"classification",front:"Arterial vs venous ulcers",back:"<b>Arterial:</b> distal (toes/dorsal foot), punched-out, pale/necrotic base, painful (worse with elevation), minimal exudate, ABI &lt;0.7. Tx: revascularization + offloading.<br><b>Venous:</b> medial gaiter area, irregular edges, heavy exudate, edema, hemosiderin staining, relatively painless, normal ABI. Tx: compression (primary)."},
  {cat:"classification",front:"Neuropathic / diabetic foot ulcer",back:"<b>Location:</b> plantar — metatarsal heads, heel, toes.<br><b>Features:</b> painless, callus rim, punched-out, moderate exudate.<br><b>Gold standard offloading:</b> total contact cast.<br><b>Screen with:</b> monofilament testing (loss of protective sensation = LOPS).<br>Also: glucose control, debridement, infection management."},
  {cat:"classification",front:"Wound edges and periwound",back:"<b>Undermining/tunneling:</b> document with clock notation (12 o'clock = toward head).<br><b>Rolled edges (epibole):</b> epithelium rolled under — needs debridement.<br><b>Maceration:</b> white, soft periwound — dressing too moist.<br><b>Erythema &gt;2 cm from edge:</b> cellulitis — refer."},

  // ── WOUND HEALING ──
  {cat:"healing",front:"Wound healing phases",back:"<b>Hemostasis</b> (0–min): vasoconstriction, platelet aggregation, clot.<br><b>Inflammatory</b> (0–4 days): vasodilation, neutrophils (d1–2), macrophages (d2–4), phagocytosis.<br><b>Proliferative</b> (4d–3wk): fibroblasts, Type III collagen, angiogenesis, granulation, epithelialization.<br><b>Remodeling</b> (3wk–2yr): Type III → Type I collagen, tensile strength → ~80%."},
  {cat:"healing",front:"Primary vs secondary vs tertiary intention",back:"<b>Primary:</b> edges approximated surgically — fastest, minimal scar.<br><b>Secondary:</b> left open, heals by granulation and contraction — larger scar, longer timeline.<br><b>Tertiary (delayed primary):</b> left open then closed later — used for contaminated wounds to reduce infection risk.<br>Most chronic wounds heal by secondary intention."},
  {cat:"healing",front:"Tissue types in wound bed",back:"<b>Granulation:</b> beefy red, cobblestone, moist — healthy, proliferative phase.<br><b>Epithelium:</b> pink/light, migrates from edges.<br><b>Slough:</b> yellow/white, stringy — devitalized, must debride.<br><b>Eschar:</b> black/brown, necrotic — debride (exception: stable dry heel eschar in ischemic limb — leave unless vascular clearance obtained).<br><b>Hypergranulation:</b> raised above edges — impedes epithelialization."},
  {cat:"healing",front:"Factors impairing wound healing",back:"<b>Local:</b> infection, desiccation, necrotic tissue, poor perfusion, repeated trauma.<br><b>Systemic:</b> diabetes (↓ leukocyte function, ↓ perfusion), malnutrition (protein/zinc/vit C), corticosteroids, smoking (vasoconstriction), age, immunosuppression, radiation.<br>Moist environment optimizes all phases."},
  {cat:"healing",front:"Wound infection — signs and criteria",back:"<b>Local signs:</b> ↑ exudate, purulence, friable granulation, malodor, periwound erythema &gt;2 cm, new/increased pain, delayed healing.<br><b>Systemic:</b> fever, leukocytosis, sepsis.<br><b>Infection threshold:</b> &gt;10⁵ organisms/gram tissue OR clinical signs.<br><b>Biofilm:</b> highly antibiotic-resistant — requires debridement."},
  {cat:"healing",front:"Wound measurement and documentation",back:"<b>Size:</b> longest length × widest width (perpendicular).<br><b>Depth:</b> cotton-tipped applicator at deepest point.<br><b>Tunneling:</b> clock notation (12 = toward head).<br><b>Document:</b> location, size, wound bed tissue %, edges, periwound, exudate (amount/type/color), odor, pain."},

  // ── WOUND MANAGEMENT ──
  {cat:"management",front:"Debridement methods",back:"<b>Sharp/surgical:</b> fastest, selective — indicated for urgent debridement.<br><b>Mechanical:</b> pulsed lavage, whirlpool. Wet-to-dry largely abandoned (non-selective, disrupts granulation).<br><b>Autolytic:</b> moisture-retentive dressings — slowest, painless, selective. Contraindicated in infected wounds.<br><b>Enzymatic:</b> collagenase (Santyl) — selective, good for necrotic tissue.<br><b>Biological (maggots):</b> highly effective for chronic wounds."},
  {cat:"management",front:"Wound dressing selection principles",back:"Match dressing to wound moisture needs:<br><b>Dry wound:</b> add moisture (hydrogel, hydrocolloid).<br><b>Heavy exudate:</b> absorb (foam, alginate).<br><b>Infected:</b> antimicrobial (silver, iodine, PHMB).<br><b>Tunneling:</b> fill (alginate rope, packing gauze).<br><b>Fragile periwound:</b> protect (silicone borders).<br>Moist healing is 30–50% faster than dry."},
  {cat:"management",front:"Dressing types — key categories",back:"<b>Hydrogel:</b> adds moisture — dry/necrotic wounds, autolytic debridement.<br><b>Hydrocolloid:</b> moisture-retentive, occlusive — partial thickness, low exudate.<br><b>Foam:</b> absorptive — moderate-heavy exudate.<br><b>Alginate:</b> highly absorptive, gels on contact — heavy exudate, bleeding wounds.<br><b>Silver:</b> antimicrobial — infected/high-risk.<br><b>NPWT (VAC):</b> promotes granulation, ↓ edema, draws edges together."},
  {cat:"management",front:"Negative pressure wound therapy (NPWT)",back:"Mechanism: sub-atmospheric pressure (−75 to −125 mmHg) → removes exudate, promotes granulation, ↓ edema, draws wound edges together.<br><b>Indications:</b> chronic wounds, surgical dehiscence, skin grafts, diabetic foot ulcers.<br><b>Contraindications:</b> untreated osteomyelitis, undebrided necrosis, malignancy in wound, exposed vessels/nerves/organs."},
  {cat:"management",front:"Offloading — pressure redistribution",back:"<b>Total contact cast (TCC):</b> gold standard for diabetic plantar ulcers — distributes pressure evenly, enforces compliance.<br><b>Removable cast walker (RCW):</b> effective but compliance-dependent.<br><b>Mattress:</b> reactive (air/foam) vs active (alternating pressure — high-risk patients).<br>30° tilt &gt; 90° side-lying for trochanteric pressure reduction."},
  {cat:"management",front:"Electrical stimulation for wound healing",back:"<b>HVPC</b> (high-voltage pulsed current): most evidence — promotes fibroblasts, angiogenesis, antibacterial.<br><b>Positive polarity:</b> attracts neutrophils/macrophages (inflammatory phase).<br><b>Negative polarity:</b> attracts fibroblasts/epithelial cells (proliferative phase).<br><b>Protocol:</b> 100 Hz, 75–200V, 45–60 min, 5×/week.<br><b>Contraindicated:</b> osteomyelitis, malignancy, over pacemaker."},
  {cat:"management",front:"Pulsed lavage with suction (PLWS)",back:"Pressurized irrigation + simultaneous suction — removes bacteria, devitalized tissue, exudate.<br><b>Effective pressure:</b> 4–15 psi. Standard: 8 psi.<br><b>Precautions:</b> aerosolization risk — PPE required (mask, goggles, gown).<br><b>Contraindicated:</b> tunnels communicating with body cavities, exposed vessels, clean granulating wounds."},
  {cat:"management",front:"Whirlpool — indications and precautions",back:"<b>Indication:</b> adherent exudate/slough — debridement only, not routine care.<br><b>Temperature:</b> 92–96°F — avoid hot in insensate or ischemic limbs.<br><b>Avoid in:</b> venous insufficiency (dependency ↑ edema), clean granulating wounds, infection (cross-contamination risk).<br><b>Duration:</b> 20 min. Largely replaced by pulsed lavage."},

  // ── BURNS ──
  {cat:"burns",front:"Burn depth classification",back:"<b>Superficial (1°):</b> epidermis — red, dry, painful, no blisters. Heals 3–5 days, no scar.<br><b>Partial thickness superficial (2°):</b> blistered, moist, very painful. Heals 7–21 days, minimal scar.<br><b>Partial thickness deep (2°):</b> mottled, less painful, may need grafting.<br><b>Full thickness (3°):</b> white/brown/black, dry, leathery, painless — requires grafting.<br><b>Subdermal (4°):</b> muscle/bone — may need amputation."},
  {cat:"burns",front:"Rule of nines — burn surface area",back:"<b>Adult:</b> head 9%, each arm 9%, anterior trunk 18%, posterior trunk 18%, each leg 18%, perineum 1%.<br><b>Child:</b> head 18%, each leg 13.5%.<br><b>Palm method:</b> patient's palm ≈ 1% BSA.<br><b>Major burn:</b> &gt;25% BSA partial thickness (adult), &gt;20% child, &gt;10% full thickness, face/hands/feet/genitalia/joints, inhalation injury."},
  {cat:"burns",front:"Burn zones (Jackson's model)",back:"<b>Coagulation:</b> center — maximum damage, necrotic, cannot be salvaged.<br><b>Stasis:</b> surrounds coagulation — viable but at risk. Goal of resuscitation = prevent progression to coagulation.<br><b>Hyperemia:</b> outermost — increased perfusion, spontaneously recovers.<br>Aggressive fluid resuscitation and positioning maintain stasis zone perfusion."},
  {cat:"burns",front:"Burn rehab — PT priorities",back:"<b>Acute:</b> positioning (anti-contracture), splinting, AROM/PROM, edema management, early ambulation.<br><b>Scar management:</b> compression garments (20–25 mmHg, 23 hrs/day, 12–18 months), silicone gel sheets, massage (after graft adherence), stretching.<br><b>Resistance training:</b> begins ~5–7 days post-graft adherence."},
  {cat:"burns",front:"Burn contracture — anti-contracture positioning",back:"<b>Neck:</b> extension + lateral rotation (not flexion).<br><b>Shoulder:</b> 90° abduction + ER (not adduction).<br><b>Elbow:</b> extension + supination (not flexion).<br><b>Hand:</b> intrinsic plus — MCP flexion 70–90°, IP extension, thumb abduction.<br><b>Hip:</b> extension + abduction. <b>Knee:</b> extension. <b>Ankle:</b> neutral/DF."},
  {cat:"burns",front:"Skin grafting — types and PT implications",back:"<b>STSG</b> (split-thickness): epidermis + partial dermis — meshed or sheet. Large areas. Donor site heals spontaneously.<br><b>FTSG</b> (full-thickness): better cosmesis — face/hands.<br><b>PT:</b> immobilize graft 3–5 days → gentle AROM. Avoid shear over new graft.<br><b>Graft failure causes:</b> infection, shear, hematoma."},
  {cat:"burns",front:"Inhalation injury",back:"<b>Above glottis:</b> heat — edema, airway obstruction. Early intubation before airway swells shut.<br><b>Below glottis:</b> chemical — delayed pulmonary edema, ARDS, bronchospasm.<br><b>CO poisoning:</b> CO binds Hgb 240× — hypoxia despite normal SpO2. Treat: 100% O2 non-rebreather.<br><b>PT:</b> airway clearance, positioning, early mobilization."},
  {cat:"burns",front:"Hypertrophic scar vs keloid",back:"<b>Hypertrophic:</b> raised, red, within wound boundaries — develops 4–8 wk, may regress 1–2 years.<br><b>Keloid:</b> extends beyond boundaries — does not regress, recurs after excision, more common in darker skin.<br><b>PT primary intervention:</b> compression garments (23 hrs/day) for full scar maturation (12–18 months). Also: silicone, steroid injection."},

  // ── LYMPHEDEMA / EDEMA ──
  {cat:"lymphedema",front:"Lymphedema — primary vs secondary",back:"<b>Primary:</b> congenital lymphatic malformation — presents at birth (congenita), puberty (praecox), or &gt;35 yrs (tarda).<br><b>Secondary (most common):</b> post-mastectomy (most common in US), radiation, filariasis (most common worldwide), trauma, malignancy.<br><b>Gold standard Tx:</b> complete decongestive therapy (CDT)."},
  {cat:"lymphedema",front:"Lymphedema staging (ISL)",back:"<b>Stage 0:</b> subclinical — no visible edema, lymphatic transport impaired.<br><b>Stage 1:</b> pitting edema, reduces with elevation (spontaneously reversible).<br><b>Stage 2:</b> pitting → non-pitting, fibrosis, does not reduce with elevation.<br><b>Stage 3:</b> severe, skin changes (papillomas, hyperkeratosis), recurrent infections.<br>PT most effective Stage 1–2."},
  {cat:"lymphedema",front:"Complete decongestive therapy (CDT)",back:"<b>Phase 1</b> (intensive, 2–4 wk daily): MLD + multilayer compression bandaging + exercise + skin care.<br><b>Phase 2</b> (maintenance, lifelong): compression garments + self-MLD + exercise + skin care.<br><b>Garment pressures:</b> mild 20–30 mmHg | moderate 30–40 | severe 40–50."},
  {cat:"lymphedema",front:"Manual lymphatic drainage (MLD)",back:"Gentle rhythmic massage following lymphatic pathways — proximal clearing first, then distal drainage.<br><b>Pressure:</b> very light (30–40 mmHg) — lymphatics are superficial and collapse under excess pressure.<br><b>Contraindications:</b> active cellulitis, active malignancy in region, acute DVT, cardiac edema (relative).<br>Not standard massage — requires specialized training."},
  {cat:"lymphedema",front:"Compression bandaging vs garments",back:"<b>Short-stretch bandaging</b> (Phase 1): inelastic — high working pressure, low resting pressure. Worn 23 hrs/day.<br><b>Long-stretch (elastic):</b> not recommended — high resting pressure impairs lymphatic flow.<br><b>Garments</b> (Phase 2): custom-fitted, replace every 3–6 months, measure in morning.<br>Never compress if ABI &lt;0.5 without vascular clearance."},
  {cat:"lymphedema",front:"Pitting vs non-pitting edema",back:"<b>Pitting</b> (protein-poor): venous insufficiency, cardiac failure, hypoalbuminemia, DVT.<br>Grading: 1+ (2mm) | 2+ (4mm) | 3+ (6mm) | 4+ (8mm).<br><b>Non-pitting</b> (protein-rich): lymphedema (late stages), myxedema, lipedema.<br><b>Stemmer's sign:</b> can't pinch skin at base of 2nd toe = lymphedema."},
  {cat:"lymphedema",front:"Lipedema vs lymphedema",back:"<b>Lipedema:</b> bilateral, symmetric fat deposition — LE but spares feet ('cuffing' at ankle). Predominantly female. Painful, bruises easily. NOT reducible with elevation or compression. Stemmer's sign negative.<br><b>Lymphedema:</b> asymmetric, involves foot, Stemmer's positive, pitting (early), reducible.<br>Lipedema can progress to lipo-lymphedema — treat lymphedema component with CDT."},
  {cat:"lymphedema",front:"Cellulitis in lymphedema",back:"High risk for recurrent cellulitis — impaired immune surveillance.<br><b>Signs:</b> acute erythema, warmth, tenderness, fever, flu-like symptoms.<br><b>Tx:</b> antibiotics (penicillin-based), rest, elevation. Pause MLD and compression until resolved.<br><b>Prevention:</b> meticulous skin care, moisturization, treat fungal infections (portal of entry)."},
  {cat:"lymphedema",front:"Exercise and lymphedema",back:"Exercise is safe and beneficial — does not worsen lymphedema when compression garment is worn.<br><b>Resistance training:</b> progressive UE resistance post-mastectomy is evidence-based — reduces lymphedema risk (previously contraindicated, now supported by RCTs).<br><b>Aquatic exercise:</b> hydrostatic pressure = natural compression.<br><b>Deep breathing:</b> promotes lymphatic flow via pressure gradient."},
  {cat:"lymphedema",front:"Venous insufficiency — PT management",back:"<b>Cause:</b> incompetent venous valves → venous hypertension → edema, skin changes, ulceration.<br><b>Skin changes:</b> hemosiderin staining, lipodermatosclerosis, varicose veins.<br><b>Tx:</b> compression (30–40 mmHg) primary. Calf pump activation (ankle pumps, walking). Elevation above heart. Moisture-retentive dressings for ulcers.<br>Avoid prolonged standing/sitting."},
];
    _cards.forEach((c,i) => {

    });
    ALL_CARDS.push(..._cards);
  })();

  (function(){
    const _cards = [
  // ── MOTOR MILESTONES ──
  { cat:"motor", front:"Head control in prone", back:"<b>2 mo:</b> lifts head 45°.<br><b>4 mo:</b> lifts head 90°, props on forearms.<br><b>6 mo:</b> props on extended arms (push-up position)."},
  { cat:"motor", front:"Rolling", back:"<b>4–5 mo:</b> prone → supine.<br><b>5–6 mo:</b> supine → prone.<br>Rolling only one direction by 6 months = red flag."},
  { cat:"motor", front:"Independent sitting", back:"<b>6 mo:</b> sits with hand support (tripod).<br><b>7–8 mo:</b> sits independently, briefly.<br><b>8–9 mo:</b> sits independently with trunk rotation."},
  { cat:"motor", front:"Crawling and creeping", back:"<b>7–8 mo:</b> belly crawling (commando).<br><b>8–10 mo:</b> hands-and-knees creeping.<br>Skipping creeping: associated with coordination concerns — note but not always pathological."},
  { cat:"motor", front:"Pulling to stand", back:"<b>8–10 mo:</b> pulls to stand at furniture.<br><b>10–12 mo:</b> cruises along furniture.<br><b>11–12 mo:</b> stands independently."},
  { cat:"motor", front:"Independent walking", back:"Average 12 months (range 9–15 months).<br><b>Not walking by 15 mo:</b> refer.<br><b>Not walking by 18 mo:</b> developmental delay.<br>Early walkers: wide BOS, arms in high guard, no heel strike initially."},
  { cat:"motor", front:"Stair negotiation", back:"<b>12–18 mo:</b> stairs with hand support, marking time.<br><b>24 mo:</b> up with rail, alternating feet.<br><b>3 yr:</b> down with rail, alternating feet.<br><b>4 yr:</b> up and down without rail."},
  { cat:"motor", front:"Running, jumping, hopping", back:"<b>18 mo:</b> runs (stiff, wide BOS). <b>2 yr:</b> jumps with both feet.<br><b>3 yr:</b> hops 1–3 times on one foot. <b>4 yr:</b> hops 4–6 times, skips.<br><b>5 yr:</b> skips smoothly, alternating feet."},
  { cat:"motor", front:"Ball skills", back:"<b>18 mo:</b> kicks stationary ball.<br><b>2 yr:</b> throws overhand, catches with arms extended.<br><b>3 yr:</b> catches with arms bent.<br><b>4–5 yr:</b> catches with hands only, throws with weight shift."},
  { cat:"motor", front:"Fine motor — grasp progression", back:"<b>5 mo:</b> palmar grasp (whole hand). <b>7–8 mo:</b> radial-digital grasp.<br><b>9 mo:</b> inferior pincer. <b>12 mo:</b> neat pincer (tip-to-tip).<br><b>18 mo:</b> 2-block tower. <b>2 yr:</b> 6-block tower."},
  { cat:"motor", front:"Handedness and tool use", back:"Handedness established 18–24 months.<br><b>Strong preference before 12 mo:</b> may indicate contralateral weakness (hemiplegia red flag).<br><b>Spoon:</b> 15–18 mo. <b>Fork:</b> 2 yr."},

  // ── LANGUAGE MILESTONES ──
  { cat:"language", front:"Early vocalization — birth to 6 months", back:"<b>Birth:</b> cries, startles to sound.<br><b>2 mo:</b> cooing, social smile.<br><b>4 mo:</b> laughs, vocalizes reciprocally.<br><b>6 mo:</b> babbles consonants (ba, da, ma)."},
  { cat:"language", front:"Babbling and first words — 6–12 months", back:"<b>6–9 mo:</b> canonical babbling (repeating syllables).<br><b>9 mo:</b> gestures (pointing, waving).<br><b>10 mo:</b> mama/dada non-specifically.<br><b>12 mo:</b> 1–3 true words, understands 'no', responds to name."},
  { cat:"language", front:"Vocabulary explosion — 12–24 months", back:"<b>12 mo:</b> 1–3 words. <b>18 mo:</b> 10–25 words, follows 1-step commands.<br><b>24 mo:</b> 50+ words, 2-word phrases ('more milk').<br>Fewer than 50 words at 24 months = refer."},
  { cat:"language", front:"Sentences and intelligibility — 2–4 years", back:"<b>2 yr:</b> 2-word phrases, 50% intelligible to strangers.<br><b>3 yr:</b> 3-word sentences, 75% intelligible.<br><b>4 yr:</b> 4–5 word sentences, 100% intelligible, tells stories."},
  { cat:"language", front:"Language red flags", back:"No babbling by 12 months.<br>No single words by 16 months.<br>No 2-word phrases by 24 months.<br><b>Any loss of previously acquired language at any age = immediate referral.</b> Regression is always a red flag."},

  // ── PRIMITIVE REFLEXES ──
  { cat:"reflex", front:"Moro reflex", back:"<b>Appears:</b> birth. <b>Integrates:</b> 4–6 months.<br>Sudden head drop → symmetric arm abduction then adduction.<br><b>Asymmetric =</b> brachial plexus injury or hemiplegia.<br>Persistence beyond 6 months = CNS dysfunction."},
  { cat:"reflex", front:"ATNR (asymmetric tonic neck reflex)", back:"<b>Appears:</b> birth. <b>Integrates:</b> 4–6 months.<br>Head turn → ipsilateral arm/leg extension, contralateral flexion ('fencer pose').<br>Persistence interferes with midline hand use and rolling."},
  { cat:"reflex", front:"STNR (symmetric tonic neck reflex)", back:"<b>Appears:</b> 6–8 months. <b>Integrates:</b> 8–12 months.<br>Neck flexion → arm flexion + leg extension.<br>Neck extension → arm extension + leg flexion.<br>Persistence interferes with hands-and-knees creeping."},
  { cat:"reflex", front:"TLR (tonic labyrinthine reflex)", back:"<b>Appears:</b> birth. <b>Integrates:</b> 6 mo (prone), 12 mo (supine).<br>Prone → ↑ flexor tone. Supine → ↑ extensor tone.<br>Persistence causes postural tone problems in CP."},
  { cat:"reflex", front:"Palmar and plantar grasp", back:"<b>Palmar:</b> birth to 4–6 months — finger contact → hand closure.<br><b>Plantar:</b> birth to 9–12 months — ball of foot pressure → toe flexion.<br>Palmar grasp persistence delays voluntary release and pincer grasp."},
  { cat:"reflex", front:"Rooting and sucking reflexes", back:"<b>Appears:</b> birth. <b>Integrates:</b> 3–4 mo (rooting), 2–5 mo (sucking becomes voluntary).<br>Absence at birth = CNS depression or prematurity concern.<br>Persistence beyond 6 months = oral motor dysfunction."},
  { cat:"reflex", front:"Protective reactions — parachute and righting", back:"<b>Landau:</b> 3–4 mo (prone suspension → extension).<br><b>Lateral propping:</b> 6–7 mo.<br><b>Parachute (forward):</b> 6–9 mo — arms extend to protect from fall.<br>Parachute must be present before independent walking is safe. Never fully integrates."},
  { cat:"reflex", front:"Positive support and stepping reactions", back:"<b>Positive support + stepping reflex:</b> birth to 2 months.<br>Both temporarily disappear, then re-emerge as voluntary skills at 10–12 months.<br>Absence at birth = hypotonia concern."},

  // ── OUTCOME MEASURES ──
  { cat:"outcome", front:"GMFM (Gross Motor Function Measure)", back:"<b>Population:</b> CP, Down syndrome, TBI.<br><b>Items:</b> 88 across 5 dimensions (lying/rolling, sitting, crawling/kneeling, standing, walking/running/jumping).<br>Higher score = better function. Gold standard for tracking motor change in CP."},
  { cat:"outcome", front:"GMFCS (Gross Motor Function Classification System)", back:"5-level ordinal scale for CP.<br><b>I:</b> walks without restrictions. <b>II:</b> walks with limitations. <b>III:</b> walks with assistive device. <b>IV:</b> limited self-mobility, may use power chair. <b>V:</b> transported in manual WC.<br>Used for prognosis, not change over time."},
  { cat:"outcome", front:"Peabody Developmental Motor Scales (PDMS-2)", back:"<b>Age:</b> birth to 5 years.<br><b>Measures:</b> reflexes, stationary, locomotion, object manipulation, grasping, visual-motor integration.<br>Produces standard scores and age equivalents. Used for diagnosis and treatment planning."},
  { cat:"outcome", front:"Bayley Scales of Infant Development (BSID-4)", back:"<b>Age:</b> 1–42 months.<br><b>Domains:</b> cognitive, language, motor, social-emotional, adaptive.<br>Motor subtests: gross motor and fine motor.<br>Gold standard for developmental delay diagnosis in infants."},
  { cat:"outcome", front:"Alberta Infant Motor Scale (AIMS)", back:"<b>Age:</b> birth to 18 months.<br>Observational — no handling required. 58 items across 4 positions (prone, supine, sitting, standing).<br>Identifies motor delay and tracks development. Sensitive to early intervention change."},
  { cat:"outcome", front:"Bruininks-Oseretsky Test (BOT-2)", back:"<b>Age:</b> 4–21 years.<br><b>Measures:</b> fine motor precision, integration, manual dexterity, bilateral coordination, balance, running speed/agility, UE coordination, strength.<br>Used for DCD, learning disabilities, CP."},
  { cat:"outcome", front:"PEDI-CAT", back:"<b>Age:</b> birth to 20 years.<br><b>Domains:</b> daily activities, mobility, social/cognitive, responsibility.<br>Caregiver-report format. Measures functional skills and caregiver assistance. Used for disability classification and program planning."},
  { cat:"outcome", front:"WeeFIM", back:"<b>Age:</b> 6 months to 7 years (or older with developmental delay).<br>18 items: self-care, sphincter control, transfers, locomotion, communication, social cognition.<br>7-point scale (total assist → complete independence). Measures burden of care."},
  { cat:"outcome", front:"6-Minute Walk Test — pediatric", back:"<b>Age:</b> 7+ years. Normative values exist for children.<br><b>Used in:</b> DMD, CP, cystic fibrosis, cardiac conditions.<br>Boys walk farther than girls; distance ↑ with age and height.<br>MDC established: DMD (~35m), CP."},

  // ── CONDITIONS ──
  { cat:"condition", front:"Cerebral palsy — classification", back:"Non-progressive brain lesion acquired before age 2.<br><b>Types:</b> spastic (most common — UMN), dyskinetic/athetoid (basal ganglia), ataxic (cerebellum), mixed.<br><b>Topography:</b> hemiplegia, diplegia (LE &gt; UE), quadriplegia.<br>Spastic diplegia associated with prematurity."},
  { cat:"condition", front:"Cerebral palsy — PT by GMFCS level", back:"<b>Level I–II:</b> activity, participation, fitness, secondary complication prevention.<br><b>Level III:</b> walking efficiency, assistive device training, endurance.<br><b>Level IV–V:</b> positioning, ROM, caregiver training, power mobility, prevent contracture and pressure injury."},
  { cat:"condition", front:"Down syndrome (Trisomy 21)", back:"<b>Key PT concerns:</b> hypotonia, ligamentous laxity, delayed milestones, flat feet, ↓ strength.<br><b>Atlantoaxial instability:</b> screen before contact sports/gymnastics — avoid neck flexion loading until cleared by imaging."},
  { cat:"condition", front:"Spina bifida — levels and function", back:"<b>L1–L2:</b> hip flexors only, WC dependent.<br><b>L3:</b> knee extension, may ambulate with KAFO.<br><b>L4:</b> ankle DF present, ambulates with AFO.<br><b>L5:</b> partial foot control. <b>S1–S2:</b> near-normal ambulation.<br>Higher lesion = less functional ambulation."},
  { cat:"condition", front:"Developmental coordination disorder (DCD)", back:"Motor performance substantially below expected for age, affecting daily activities. Not explained by neurological condition.<br><b>Features:</b> clumsy, slow, inaccurate movement.<br><b>Tx:</b> task-oriented approach (CO-OP). BOT-2 used for diagnosis."},
  { cat:"condition", front:"Duchenne muscular dystrophy (DMD)", back:"X-linked recessive, males only.<br><b>Presents 3–5 yr:</b> proximal weakness, Gowers' sign, calf pseudohypertrophy.<br>Loses ambulation ~10–12 years. Scoliosis after wheelchair use.<br><b>Avoid eccentric exercise</b> — accelerates damage. Focus: function, contracture prevention, respiratory support."},
  { cat:"condition", front:"Brachial plexus birth injury (Erb's palsy)",back:"<b>C5–C6:</b> 'waiter's tip' — shoulder IR/adduction, elbow extension, forearm pronation, wrist flexion.<br><b>C8–T1 (Klumpke's):</b> hand intrinsic weakness.<br><b>Tx:</b> PROM, positioning, splinting, strengthening.<br>Horner's with Klumpke's = root avulsion (poor prognosis)."},
  { cat:"condition", front:"Juvenile idiopathic arthritis (JIA)", back:"Chronic arthritis onset before 16 years.<br><b>PT role:</b> maintain ROM and strength, aquatic therapy, splinting, functional mobility.<br><b>Morning stiffness</b> is hallmark — schedule activity after warmup.<br>Avoid high-impact during active flare."},
  { cat:"condition", front:"ASD — PT considerations", back:"Motor delays and DCD are common comorbidities.<br>Sensory processing differences affect participation.<br><b>Strategies:</b> predictable routines, visual schedules, minimize unexpected sensory input, task-specific practice.<br>Focus on functional motor goals with family involvement."},
  { cat:"condition", front:"Torticollis (congenital muscular)", back:"SCM shortening → ipsilateral cervical lateral flexion + contralateral rotation.<br>Associated with positional plagiocephaly.<br><b>Tx:</b> PROM into contralateral lateral flexion and ipsilateral rotation, strengthening, repositioning.<br>Refer for helmet if plagiocephaly persists beyond 4 months of conservative care."},
  { cat:"condition", front:"Gowers' sign", back:"Child 'walks up' thighs with hands to rise from floor — compensates for proximal hip and knee extensor weakness.<br>Classic in DMD but also seen in SMA and other myopathies with significant proximal LE weakness."},
  { cat:"condition", front:"Legg-Calvé-Perthes disease", back:"AVN of femoral head. Ages 4–8, more common in boys.<br><b>Presents:</b> painless limp, limited hip IR and abduction.<br><b>X-ray:</b> femoral head fragmentation.<br><b>PT:</b> maintain ROM, non-impact activity during avascular phase. Post-op: ROM and gait training."},
  { cat:"condition", front:"SCFE (slipped capital femoral epiphysis)", back:"Femoral head slips posteriorly/inferiorly off physis. Ages 10–16, obese adolescents.<br><b>Presents:</b> hip or knee pain, obligate hip ER with flexion.<br>Always <b>NWB until surgical fixation</b>. Bilateral in 20–40%."},
  { cat:"condition", front:"Scoliosis — screening and intervention", back:"<b>Adam's forward bend test</b> screens for structural curve.<br><b>Cobb angle:</b> &lt;10° = normal | 10–25° = monitor | 25–45° = bracing (skeletally immature) | &gt;45° = surgical.<br><b>Schroth method:</b> most evidence-supported PT approach for curve reduction and stabilization."},
  { cat:"condition", front:"Prematurity and adjusted age", back:"Correct for prematurity until 24 months.<br>Adjusted age = chronological age − weeks premature.<br><b>Example:</b> 6-month-old born 8 weeks early → adjusted age 4 months.<br>Preterm infants at risk for IVH, PVL, CP, sensory deficits."},
];
